            if (!str) return '';
            const p = str.split('-');
            return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : str;

            const day = String(d.getDate()).padStart(2, '0');

            const seconds = String(d.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }
