<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClientSync | Portal del Empleado</title>
    <link rel="stylesheet" href="./css/main.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f1f5f9; 
            margin: 0; 
            padding: 12px; 
        }
        .container { 
            max-width: 500px; 
            margin: 10px auto 60px auto; 
            background: white; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.06); 
            border: 1px solid #e2e8f0;
        }
        
        .selector-box {
            background: #f8fafc;
            border: 1px solid #cbd5e0;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        select { 
            font-size: 15px; 
            width: 100%; 
            padding: 10px 12px; 
            border: 1px solid #cbd5e0; 
            border-radius: 8px; 
            background: white; 
            outline: none;
            color: #1e293b;
            font-weight: 600;
        }

        /* Menú interno amigable del empleado */
        .employee-menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .action-card {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #cbd5e0;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            text-align: left;
            width: 100%;
        }
        .action-card:hover {
            background: #ebf8ff;
            border-color: #2563eb;
            transform: translateY(-1px);
        }
        .action-icon {
            font-size: 1.5rem;
            width: 42px;
            height: 42px;
            background: #e2e8f0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .action-info h3 {
            margin: 0 0 2px 0;
            font-size: 0.9rem;
            color: #1e293b;
            font-weight: 700;
        }
        .action-info p {
            margin: 0;
            font-size: 0.75rem;
            color: #64748b;
        }

        /* Tarjeta de cliente para la vista de lista */
        .client-card { 
            background: #ffffff; 
            border: 1px solid #e2e8f0;
            border-left: 5px solid #2563eb; 
            padding: 14px; 
            border-radius: 12px; 
            margin-bottom: 12px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.03); 
        }

        .btn-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            margin-top: 10px;
            width: 100%;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
            transition: background 0.2s;
        }
        .btn-nav:hover { background: #1d4ed8; }

        /* Calendario mensual limpio */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
        .cal-header { text-align: center; font-weight: bold; font-size: 0.75rem; color: #64748b; padding: 4px 0; }
        .cal-day { min-height: 44px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: #334155; }
        .cal-day:hover { background: #e2e8f0; }
        .cal-day.has-appointments { background: #eff6ff; border-color: #3b82f6; color: #1d4ed8; }
        .badge-count { font-size: 0.6rem; background: #2563eb; color: white; padding: 1px 5px; border-radius: 10px; margin-top: 2px; }

        .custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 12px; }
        .custom-modal-content { background: white; width: 100%; max-width: 480px; max-height: 85vh; padding: 18px; border-radius: 16px; display: flex; flex-direction: column; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabecera -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
            <h1 style="margin: 0; font-size: 1.2rem; color: #1e293b; font-weight: 800;">👷‍♂️ Portal del Empleado</h1>
            <a href="./index.html" style="padding: 6px 10px; background: #e2e8f0; color: #475569; text-decoration: none; border-radius: 8px; font-size: 0.78rem; font-weight: 600;">Menú Principal</a>
        </div>

        <!-- Selector de empleado -->
        <div class="selector-box">
            <label style="display: block; font-weight: 700; margin-bottom: 6px; color: #475569; font-size: 0.82rem;">¿Quién eres?</label>
            <select id="employee-selector">
                <option value="">-- Selecciona tu nombre --</option>
            </select>
        </div>

        <!-- MENÚ INTERNO DEL EMPLEADO (Aparece al seleccionar el nombre) -->
        <div id="employee-menu" class="employee-menu-grid" style="display: none;">
            <!-- Opción 1: Ver Ruta Interactiva con Pines Numerados -->
            <button type="button" class="action-card" id="btn-goto-route-map">
                <div class="action-icon">🗺️</div>
                <div class="action-info">
                    <h3>Mapa de Ruta de Hoy</h3>
                    <p>Ver los clientes del día con pines numerados (1, 2, 3...) y GPS.</p>
                </div>
            </button>

            <!-- Opción 2: Ver tu día (Estructura / Lista de Clientes de Hoy) -->
            <button type="button" class="action-card" id="btn-view-day-list">
                <div class="action-icon">📋</div>
                <div class="action-info">
                    <h3>Estructura de Clientes de Hoy</h3>
                    <p>Consulta la lista detallada de tus tareas del día actual.</p>
                </div>
            </button>

            <!-- Opción 3: Ver tu mes (Calendario Mensual) -->
            <button type="button" class="action-card" id="btn-view-month-cal">
                <div class="action-icon">🗓️</div>
                <div class="action-info">
                    <h3>Calendario Mensual</h3>
                    <p>Revisa tus asignaciones de todo el mes de forma general.</p>
                </div>
            </button>
        </div>

        <!-- Botón para regresar al menú interno del empleado -->
        <div id="back-to-menu-container" style="display: none; margin-bottom: 12px;">
            <button type="button" id="btn-back-menu" style="background: #e2e8f0; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: bold; cursor: pointer; color: #475569;">← Volver al Menú de Opciones</button>
        </div>

        <!-- Área dinámica donde se despliega la lista o el calendario -->
        <div id="dynamic-content-area"></div>
    </div>

    <!-- Modal para ver las citas de un día seleccionado en el calendario -->
    <div id="day-modal" class="custom-modal">
        <div class="custom-modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 12px;">
                <h3 id="modal-day-title" style="margin: 0; font-size: 0.95rem; color: #1e293b;">📅 Citas del Día</h3>
                <button type="button" id="close-modal-btn" style="background: #e2e8f0; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.75rem;">✕ Cerrar</button>
            </div>
            <div id="modal-day-body"></div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabaseClient.js';

        let allClients = [];
        let allAppointments = [];
        let allEmployees = [];
        let selectedEmployee = '';
        let selectedMonthDate = new Date();

        const todayStrSystem = new Date().toISOString().split('T')[0];

        function formatDateToDDMMYYYY(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;
        }

        async function initSchedulePortal() {
            try {
                const [{ data: clients }, { data: appointments }, { data: employees }] = await Promise.all([
                    supabase.from('clients').select('*').order('name', { ascending: true }),
                    supabase.from('appointments').select('*').order('time_slot', { ascending: true }),
                    supabase.from('employees').select('*').order('name', { ascending: true })
                ]);

                allClients = clients || [];
                allAppointments = appointments || [];
                allEmployees = employees || [];

                const selector = document.getElementById('employee-selector');
                allEmployees.forEach(emp => {
                    selector.innerHTML += `<option value="${emp.name}">${emp.name}</option>`;
                });
            } catch (err) {
                console.error('Error al inicializar:', err);
            }
        }

        document.getElementById('employee-selector').addEventListener('change', (e) => {
            selectedEmployee = e.target.value;
            const empMenu = document.getElementById('employee-menu');
            const contentArea = document.getElementById('dynamic-content-area');
            const backBtnContainer = document.getElementById('back-to-menu-container');

            if (!selectedEmployee) {
                empMenu.style.display = 'none';
                backBtnContainer.style.display = 'none';
                contentArea.innerHTML = '';
                return;
            }

            empMenu.style.display = 'grid';
            backBtnContainer.style.display = 'none';
            contentArea.innerHTML = '';
        });

        // Botón 1: Ir directo al mapa de ruta del día (employee-route.html)
        document.getElementById('btn-goto-route-map').addEventListener('click', () => {
            if (!selectedEmployee) return;
            // Redirige al programa de mapa interactivo pasando el empleado en la URL si lo deseas, o se mantiene en su sesión
            window.location.href = `./employee-route.html?employee=${encodeURIComponent(selectedEmployee)}`;
        });

        // Botón 2: Ver tu día (Lista / Estructura detallada de clientes de hoy)
        document.getElementById('btn-view-day-list').addEventListener('click', () => {
            document.getElementById('employee-menu').style.display = 'none';
            document.getElementById('back-to-menu-container').style.display = 'block';
            renderDaySchedule(document.getElementById('dynamic-content-area'), todayStrSystem, "Estructura de Clientes de Hoy");
        });

        // Botón 3: Ver tu mes (Calendario mensual)
        document.getElementById('btn-view-month-cal').addEventListener('click', () => {
            document.getElementById('employee-menu').style.display = 'none';
            document.getElementById('back-to-menu-container').style.display = 'block';
            renderMonthCalendar(document.getElementById('dynamic-content-area'));
        });

        // Botón de Volver al menú interno
        document.getElementById('btn-back-menu').addEventListener('click', () => {
            document.getElementById('dynamic-content-area').innerHTML = '';
            document.getElementById('back-to-menu-container').style.display = 'none';
            document.getElementById('employee-menu').style.display = 'grid';
        });

        function getEmployeeAppointmentsForDate(dateStr) {
            const clientsMap = new Map(allClients.map(c => [c.id, c]));
            return allAppointments.filter(appt => {
                if (!appt.scheduled_date || appt.scheduled_date.split('T')[0] !== dateStr) return false;
                if (appt.assigned_employee !== selectedEmployee) return false;
                return clientsMap.has(appt.client_id);
            });
        }

        function renderDaySchedule(container, dateStr, titleText) {
            const dayAppointments = getEmployeeAppointmentsForDate(dateStr);
            const clientsMap = new Map(allClients.map(c => [c.id, c]));

            if (dayAppointments.length === 0) {
                container.innerHTML = `
                    <div style="background: #fffbeb; border: 1px solid #fef3c7; padding: 16px; border-radius: 10px; text-align: center; color: #b45309; margin-top: 10px;">
                        <strong>No tienes citas programadas para el ${formatDateToDDMMYYYY(dateStr)}.</strong>
                        <p style="font-size: 0.78rem; margin: 4px 0 0 0;">Buen trabajo.</p>
                    </div>
                `;
                return;
            }

            let html = `<h3 style="font-size: 0.95rem; color: #1e293b; margin-bottom: 10px;">📅 ${titleText} (${formatDateToDDMMYYYY(dateStr)}):</h3>`;

            dayAppointments.forEach((appt, index) => {
                const client = clientsMap.get(appt.client_id);
                const timeStr = appt.time_slot || '09:00';
                const hoursInfo = appt.estimated_hours ? ` (${appt.estimated_hours}h est.)` : '';
                const serviceStr = appt.service_requested ? `<p style="margin: 2px 0 4px 0; font-size: 0.82rem; color: #2563eb; font-weight: 700;">🛠️ ${appt.service_requested}</p>` : '';
                
                const mapsQuery = (client.latitude && client.longitude) ? `${client.latitude},${client.longitude}` : encodeURIComponent(client.address || '');
                const mapsNavUrl = `https://www.google.com/maps/dir/?api=1&destination=${mapsQuery}&travelmode=driving`;

                html += `
                    <div class="client-card">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <strong style="font-size: 1rem; color: #1e293b;">#${index + 1} - ⏰ ${timeStr}h</strong>
                            <span style="font-size: 0.75rem; background: #e2e8f0; padding: 2px 6px; border-radius: 6px; font-weight: 700; color: #475569;">CP: ${client.postal_code || 'N/A'}</span>
                        </div>
                        <h4 style="margin: 6px 0 2px 0; font-size: 0.95rem; color: #0f172a;">${client.name}</h4>
                        ${serviceStr}
                        <p style="margin: 0 0 3px 0; font-size: 0.82rem; color: #475569;">📍 ${client.address || 'Sin dirección'}${hoursInfo}</p>
                        <p style="margin: 0 0 6px 0; font-size: 0.82rem; color: #475569;">📞 Tel: ${client.phone || 'No registrado'}</p>
                        <a href="${mapsNavUrl}" target="_blank" class="btn-nav">🧭 Iniciar Navegación GPS</a>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderMonthCalendar(container) {
            const year = selectedMonthDate.getFullYear();
            const month = selectedMonthDate.getMonth();
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const offset = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

            let calendarHtml = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; margin-top: 5px;">
                    <button type="button" id="prev-month" style="width: auto; padding: 6px 10px; font-size: 0.8rem; background: #e2e8f0; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">◀</button>
                    <strong style="font-size: 0.95rem; color: #1e293b;">${monthNames[month]} ${year}</strong>
                    <button type="button" id="next-month" style="width: auto; padding: 6px 10px; font-size: 0.8rem; background: #e2e8f0; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">▶</button>
                </div>
                <div class="calendar-grid">
                    <div class="cal-header">Lun</div><div class="cal-header">Mar</div><div class="cal-header">Mié</div><div class="cal-header">Jue</div><div class="cal-header">Vie</div><div class="cal-header">Sáb</div><div class="cal-header">Dom</div>
            `;

            for (let i = 0; i < offset; i++) {
                calendarHtml += `<div class="cal-day" style="background: transparent; border: none;"></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayAppts = getEmployeeAppointmentsForDate(dateStr);
                const count = dayAppts.length;
                
                let classes = 'cal-day';
                if (count > 0) classes += ' has-appointments';

                calendarHtml += `
                    <div class="${classes}" data-date="${dateStr}">
                        <span>${day}</span>
                        ${count > 0 ? `<span class="badge-count">${count}</span>` : ''}
                    </div>
                `;
            }

            calendarHtml += `</div>`;
            container.innerHTML = calendarHtml;

            document.getElementById('prev-month').addEventListener('click', () => { 
                selectedMonthDate.setMonth(selectedMonthDate.getMonth() - 1); 
                renderMonthCalendar(container); 
            });
            document.getElementById('next-month').addEventListener('click', () => { 
                selectedMonthDate.setMonth(selectedMonthDate.getMonth() + 1); 
                renderMonthCalendar(container); 
            });

            document.querySelectorAll('.cal-day[data-date]').forEach(cell => {
                cell.addEventListener('click', () => {
                    openDayModal(cell.getAttribute('data-date'));
                });
            });
        }

        function openDayModal(dateStr) {
            document.getElementById('modal-day-title').textContent = `📅 Citas del ${formatDateToDDMMYYYY(dateStr)}`;
            renderDaySchedule(document.getElementById('modal-day-body'), dateStr, "Tus tareas");
            document.getElementById('day-modal').style.display = 'flex';
        }

        document.getElementById('close-modal-btn').addEventListener('click', () => { 
            document.getElementById('day-modal').style.display = 'none'; 
        });

        initSchedulePortal();
    </script>
</body>
</html>
