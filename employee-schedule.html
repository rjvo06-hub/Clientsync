<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClientSync | Mobiles Portal</title>
    <link rel="stylesheet" href="./css/main.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 16px; color: #0f172a; }
        .app-container { max-width: 440px; margin: 10px auto 70px auto; background: #ffffff; padding: 24px 20px; border-radius: 28px; box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid #f1f5f9; }
        .header h1 { font-size: 1.15rem; font-weight: 800; margin: 0; color: #0f172a; }
        .version-tag { font-size: 0.6rem; background: #f0fdf4; color: #15803d; border: 1px solid #dcfce7; padding: 2px 8px; border-radius: 6px; font-weight: 700; margin-left: 6px; }
        .icon-btn { background: #f8fafc; border: 1px solid #e2e8f0; padding: 8px 14px; border-radius: 12px; font-weight: 600; font-size: 0.75rem; color: #334155; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-active-clients { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; padding: 6px 12px; border-radius: 12px; font-weight: 700; font-size: 0.7rem; cursor: pointer; }
        .menu-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px 18px; margin-bottom: 12px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
        .timer-display { font-variant-numeric: tabular-nums; font-size: 2.2rem; font-weight: 800; color: #0f172a; text-align: center; margin: 12px 0 18px 0; }
        .card-box { background: #fafafa; border: 1px solid #eef2f6; border-radius: 20px; padding: 20px 16px; margin-bottom: 20px; }
        .btn { width: 100%; padding: 13px; border-radius: 14px; border: none; font-weight: 700; font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-primary { background: #0f172a; color: white; }
        .btn-success { background: #16a34a; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-secondary { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .item-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
        .team-chip { background: #f0fdf4; color: #15803d; font-size: 0.7rem; padding: 4px 10px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; border: 1px solid #dcfce7; }
        .team-chip button { background: none; border: none; color: #dc2626; font-weight: 800; cursor: pointer; padding: 0 0 0 6px; font-size: 0.8rem; }
        .tabs-header { display: flex; gap: 6px; margin-bottom: 16px; background: #f1f5f9; padding: 4px; border-radius: 14px; }
        .tab-pill { flex: 1; padding: 9px; border-radius: 10px; border: none; background: transparent; color: #64748b; font-weight: 700; font-size: 0.75rem; cursor: pointer; text-align: center; }
        .tab-pill.active { background: #ffffff; color: #0f172a; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }
        .cal-header { text-align: center; font-weight: 700; font-size: 0.68rem; color: #94a3b8; padding: 4px 0; }
        .cal-day { min-height: 40px; background: #fafafa; border: 1px solid #e2e8f0; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-size: 0.78rem; font-weight: 600; color: #334155; }
        .cal-day.has-appointments { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; font-weight: 700; }
        .badge { font-size: 0.55rem; background: #16a34a; color: white; padding: 1px 5px; border-radius: 6px; margin-top: 2px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); z-index: 1000; justify-content: center; align-items: center; padding: 16px; backdrop-filter: blur(4px); }
        .modal-body { background: white; width: 100%; max-width: 380px; max-height: 85vh; padding: 20px; border-radius: 24px; display: flex; flex-direction: column; overflow-y: auto; }
        .select-dropdown { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #cbd5e1; font-size: 0.85rem; background: #f8fafc; color: #0f172a; margin-bottom: 14px; outline: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header" id="app-header">
            <div>
                <h1 id="header-title" style="display: inline-block;">👷‍♂️ Portal</h1>
                <span class="version-tag">⏱️ Echtzeit</span>
            </div>
            <a href="./index.html" class="icon-btn">🏠 Beenden</a>
        </div>
        <div id="app-content"></div>
    </div>

    <!-- Modals -->
    <div id="day-modal" class="modal-overlay">
        <div class="modal-body">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px;">
                <h3 id="modal-title" style="margin: 0; font-size: 0.9rem;">📅 Tagestermine</h3>
                <button type="button" id="close-modal" class="icon-btn">✕</button>
            </div>
            <div id="modal-content"></div>
        </div>
    </div>

    <div id="employee-modal" class="modal-overlay">
        <div class="modal-body" style="max-width: 320px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px;">
                <h3 style="margin: 0; font-size: 0.9rem;">👥 Person zum Besuch hinzufügen</h3>
                <button type="button" id="close-emp-modal" class="icon-btn">✕</button>
            </div>
            <p style="font-size: 0.75rem; color: #64748b; margin-top: 0; margin-bottom: 10px;">Mitarbeiter auswählen:</p>
            <select id="employee-select-dropdown" class="select-dropdown"></select>
            <div style="display: flex; gap: 8px;">
                <button type="button" class="btn btn-secondary" id="btn-cancel-emp" style="flex: 1;">Abbrechen</button>
                <button type="button" class="btn btn-primary" id="btn-confirm-emp" style="flex: 1;">Hinzufügen</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabaseClient.js';

        let allClients = [];
        let allAppointments = [];
        let activeVisitsList = [];
        let allEmployeeNames = [];
        let employeeDailyLog = null;
        let selectedEmployee = '';
        let selectedMonthDate = new Date();
        let timerInterval = null;
        let visitLiveInterval = null;
        let timetrackViewMode = 'assigned'; 
        let currentAppointmentForEmp = null;

        const nowLocalDate = new Date();
        const todayStr = `${nowLocalDate.getFullYear()}-${String(nowLocalDate.getMonth() + 1).padStart(2, '0')}-${String(nowLocalDate.getDate()).padStart(2, '0')}`;
        
        const STORAGE_KEY = 'clientSync_saved_employee';
        const urlParams = new URLSearchParams(window.location.search);
        selectedEmployee = urlParams.get('employee') || localStorage.getItem(STORAGE_KEY) || '';
        const currentView = urlParams.get('view');
        const returnDate = urlParams.get('date');

        if (!selectedEmployee) {
            alert('Bitte melden Sie sich zuerst an.');
            window.location.href = './index.html';
        } else {
            localStorage.setItem(STORAGE_KEY, selectedEmployee);
        }

        function formatDate(str) {
            if (!str) return '';
            const p = str.split('-');
            return p.length === 3 ? `${p[2]}.${p[1]}.${p[0]}` : str;
        }

        function getPureLocalTimestamp() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
        }

        function parseTimestampToMs(ts) {
            if (!ts) return Date.now();
            let clean = ts.replace(' ', 'T');
            if (!clean.includes('Z') && !clean.includes('+') && !clean.includes('-', 10)) {
                const parts = clean.split(/[-T:]/);
                if (parts.length >= 6) {
                    return new Date(parts[0], parts[1] - 1, parts[2], parts[3], parts[4], parts[5]).getTime();
                }
            }
            return new Date(clean).getTime();
        }

        function unifySessions(sessionsArray) {
            if (!sessionsArray || !Array.isArray(sessionsArray)) return [];
            const cleaned = [];
            sessionsArray.forEach(s => {
                const name = (s.employee || '').trim();
                if (!name) return;
                cleaned.push({
                    employee: name,
                    check_in: s.check_in || null,
                    check_out: s.check_out || null,
                    minutes: Math.max(1, Number(s.minutes) || 0)
                });
            });
            return cleaned;
        }

        function parseDeductions(deductionsArray) {
            if (!deductionsArray || !Array.isArray(deductionsArray)) return [];
            return deductionsArray.map(d => ({
                employee: (d.employee || '').trim(),
                lunch_start: d.lunch_start || null,
                lunch_end: d.lunch_end || null,
                minutes: Math.max(0, Number(d.minutes) || 0)
            }));
        }

        async function init() {
            try {
                await fetchData();
                await fetchDailyLog();
                setupRealtimeSubscriptions();

                if (currentView === 'citas') renderCitasView('today');
                else if (currentView === 'calendar') renderCitasView('calendar');
                else if (currentView === 'timetrack') renderTimetrackView();
                else renderMainMenu();
            } catch (err) { console.error('Fehler beim Starten:', err); }
        }

        async function fetchData() {
            const [{ data: clients }, { data: appointments }, { data: activeVisits }, { data: employeesData }] = await Promise.all([
                supabase.from('clients').select('*').order('name', { ascending: true }),
                supabase.from('appointments').select('*').order('time_slot', { ascending: true }),
                supabase.from('active_visits').select('*'),
                supabase.from('employees').select('*')
            ]);
            
            allClients = clients || [];
            allAppointments = appointments || [];
            activeVisitsList = activeVisits || [];
            
            const namesSet = new Set();
            if (employeesData) {
                employeesData.forEach(emp => {
                    const name = emp.name || emp.employee_name || emp.full_name || emp.username;
                    if (name) namesSet.add(name.trim());
                });
            }
            if (selectedEmployee) namesSet.add(selectedEmployee);
            allEmployeeNames = Array.from(namesSet).sort();
        }

        async function fetchDailyLog() {
            try {
                const { data } = await supabase.from('employee_daily_logs')
                    .select('*')
                    .eq('employee_name', selectedEmployee)
                    .eq('work_date', todayStr)
                    .maybeSingle();
                employeeDailyLog = data;
            } catch (err) { console.error(err); }
        }

        function setupRealtimeSubscriptions() {
            supabase.channel('appointments-realtime-channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'appointments' }, async () => { await fetchData(); refreshCurrentView(); })
                .subscribe();

            supabase.channel('active-visits-realtime-channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'active_visits' }, async () => { await fetchData(); refreshCurrentView(); })
                .subscribe();
        }

        function refreshCurrentView() {
            const activeViewParam = new URLSearchParams(window.location.search).get('view');
            if (activeViewParam === 'timetrack' || document.getElementById('clients-timetrack-list')) renderTimetrackView();
            else if (activeViewParam === 'citas') renderCitasView('today');
            else if (activeViewParam === 'calendar') renderCitasView('calendar');
        }

        function renderMainMenu() {
            if (timerInterval) clearInterval(timerInterval);
            if (visitLiveInterval) clearInterval(visitLiveInterval);
            document.getElementById('header-title').textContent = `👷‍♂️ ${selectedEmployee}`;
            document.getElementById('app-header').querySelector('a').style.display = 'inline-flex';

            document.getElementById('app-content').innerHTML = `
                <div style="text-align: center; margin-bottom: 14px;">
                    <p style="font-size: 0.78rem; color: #64748b; margin: 0;">Wählen Sie einen Bereich:</p>
                </div>
                <div class="menu-card" id="card-citas">
                    <div>
                        <h3>📅 Meine Termine & Agenda</h3>
                        <p>Geplante Besuche für heute und diesen Monat anzeigen</p>
                    </div>
                    <span style="color: #3b82f6; font-weight: bold;">➔</span>
                </div>
                <div class="menu-card" id="card-timetrack">
                    <div>
                        <h3>⏱️ Zeiterfassung</h3>
                        <p>Arbeitstag, Pause und aktive Kunden</p>
                    </div>
                    <span style="color: #3b82f6; font-weight: bold;">➔</span>
                </div>
            `;

            document.getElementById('card-citas').addEventListener('click', () => {
                window.history.pushState({}, '', `?employee=${encodeURIComponent(selectedEmployee)}&view=citas`);
                renderCitasView('today');
            });
            document.getElementById('card-timetrack').addEventListener('click', () => {
                window.history.pushState({}, '', `?employee=${encodeURIComponent(selectedEmployee)}&view=timetrack`);
                renderTimetrackView();
            });
        }

        function renderCitasView(sub) {
            if (timerInterval) clearInterval(timerInterval);
            if (visitLiveInterval) clearInterval(visitLiveInterval);
            document.getElementById('header-title').textContent = `📅 Agenda`;
            document.getElementById('app-header').querySelector('a').style.display = 'none';

            const container = document.getElementById('app-content');
            container.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <button type="button" class="icon-btn" id="btn-back">← Menü</button>
                    <span style="font-size: 0.75rem; font-weight: 700; color: #64748b;">${formatDate(todayStr)}</span>
                </div>
                <div class="tabs-header">
                    <button type="button" class="tab-pill ${sub === 'today' ? 'active' : ''}" id="tab-today">📅 Heute</button>
                    <button type="button" class="tab-pill ${sub === 'calendar' ? 'active' : ''}" id="tab-cal">🗓️ Monat</button>
                </div>
                <div id="sub-view-content"></div>
            `;

            document.getElementById('btn-back').addEventListener('click', () => {
                window.history.pushState({}, '', `?employee=${encodeURIComponent(selectedEmployee)}`);
                renderMainMenu();
            });
            document.getElementById('tab-today').addEventListener('click', () => renderCitasView('today'));
            document.getElementById('tab-cal').addEventListener('click', () => renderCitasView('calendar'));

            const subContainer = document.getElementById('sub-view-content');
            if (sub === 'today') renderDayAppts(subContainer, todayStr, "Heutige Termine");
            else renderCalendar(subContainer);
        }

        function getApptsForDate(dateStr) {
            const map = new Map(allClients.map(c => [c.id, c]));
            return allAppointments.filter(a => {
                if (!a.scheduled_date || a.scheduled_date.split('T')[0] !== dateStr) return false;
                if (!a.assigned_employee) return false;
                const primary = a.assigned_employee.split(',')[0].trim().toLowerCase();
                return primary === selectedEmployee.toLowerCase() && map.has(a.client_id);
            });
        }

        function renderDayAppts(container, dateStr, title) {
            const appts = getApptsForDate(dateStr);
            const map = new Map(allClients.map(c => [c.id, c]));
            const routeUrl = `./employee-route.html?employee=${encodeURIComponent(selectedEmployee)}&date=${dateStr}&view=calendar`;

            let html = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <strong style="font-size: 0.82rem; color: #1e293b;">${title} (${formatDate(dateStr)})</strong>
                    ${appts.length > 0 ? `<a href="${routeUrl}" class="icon-btn" style="background:#eff6ff; color:#1d4ed8;">🗺️ Karte</a>` : ''}
                </div>
            `;

            if (appts.length === 0) {
                html += `<div style="padding: 16px; text-align: center; color: #64748b; font-size: 0.78rem; background: #f8fafc; border-radius: 10px; border: 1px solid #e2e8f0;">Keine Termine für dieses Datum.</div>`;
            } else {
                appts.forEach((a, idx) => {
                    const c = map.get(a.client_id);
                    html += `
                        <div class="item-card">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
                                <strong style="font-size: 0.8rem;">#${idx + 1} ${c.name}</strong>
                                <span style="font-size: 0.75rem; color: #2563eb; font-weight: 700;">⏰ ${a.time_slot || '09:00'} Uhr</span>
                            </div>
                            <div style="font-size: 0.72rem; color: #64748b;">📍 ${c.address || 'Keine Adresse'}</div>
                        </div>
                    `;
                });
            }
            container.innerHTML = html;
        }

        function renderCalendar(container) {
            const y = selectedMonthDate.getFullYear();
            const m = selectedMonthDate.getMonth();
            const names = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
            const first = new Date(y, m, 1).getDay();
            const total = new Date(y, m + 1, 0).getDate();
            const offset = first === 0 ? 6 : first - 1;

            let html = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <button type="button" class="icon-btn" id="prev-m">◀</button>
                    <strong style="font-size: 0.85rem;">${names[m]} ${y}</strong>
                    <button type="button" class="icon-btn" id="next-m">▶</button>
                </div>
                <div class="calendar-grid">
                    <div class="cal-header">Mo</div><div class="cal-header">Di</div><div class="cal-header">Mi</div><div class="cal-header">Do</div><div class="cal-header">Fr</div><div class="cal-header">Sa</div><div class="cal-header">So</div>
            `;
            for (let i = 0; i < offset; i++) html += `<div></div>`;
            for (let d = 1; d <= total; d++) {
                const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const count = getApptsForDate(dateStr).length;
                html += `
                    <div class="cal-day ${count > 0 ? 'has-appointments' : ''}" data-date="${dateStr}">
                        <span>${d}</span>
                        ${count > 0 ? `<span class="badge">${count}</span>` : ''}
                    </div>
                `;
            }
            html += `</div>`;
            container.innerHTML = html;

            document.getElementById('prev-m').addEventListener('click', () => { selectedMonthDate.setMonth(m - 1); renderCalendar(container); });
            document.getElementById('next-m').addEventListener('click', () => { selectedMonthDate.setMonth(m + 1); renderCalendar(container); });
            container.querySelectorAll('.cal-day[data-date]').forEach(el => {
                el.addEventListener('click', () => openModal(el.getAttribute('data-date')));
            });
        }

        function openModal(dateStr) {
            document.getElementById('modal-title').textContent = `📅 Termine am ${formatDate(dateStr)}`;
            renderDayAppts(document.getElementById('modal-content'), dateStr, "Aufgaben");
            document.getElementById('day-modal').style.display = 'flex';
        }
        document.getElementById('close-modal').addEventListener('click', () => document.getElementById('day-modal').style.display = 'none');

        function renderTimetrackView() {
            if (timerInterval) clearInterval(timerInterval);
            if (visitLiveInterval) clearInterval(visitLiveInterval);

            document.getElementById('header-title').textContent = `⏱️ Zeiten`;
            document.getElementById('app-header').querySelector('a').style.display = 'none';

            const container = document.getElementById('app-content');
            const map = new Map(allClients.map(c => [c.id, c]));
            const todayAppts = allAppointments.filter(a => a.scheduled_date && a.scheduled_date.split('T')[0] === todayStr);

            const assignedTodayAppts = todayAppts.filter(a => {
                if (!a.assigned_employee) return false;
                const primary = a.assigned_employee.split(',')[0].trim().toLowerCase();
                return primary === selectedEmployee.toLowerCase() && map.has(a.client_id);
            });
            const assignedApptIds = new Set(assignedTodayAppts.map(a => a.id));

            let externalActiveVisit = null;
            const myActiveVisit = activeVisitsList.find(v => v.employee_name.toLowerCase() === selectedEmployee.toLowerCase());
            if (myActiveVisit) {
                const appt = allAppointments.find(a => String(a.id) === String(myActiveVisit.appointment_id));
                if (appt && map.has(appt.client_id) && !assignedApptIds.has(appt.id)) {
                    externalActiveVisit = { appt: appt, client: map.get(appt.client_id) };
                }
            }

            let statusStr = 'Arbeitstag nicht gestartet';
            let badgeBg = '#f1f5f9';
            let badgeColor = '#475569';
            if (employeeDailyLog) {
                if (employeeDailyLog.status === 'activo') { statusStr = '🟢 Arbeitstag läuft'; badgeBg = '#f0fdf4'; badgeColor = '#15803d'; }
                else if (employeeDailyLog.status === 'almuerzo') { statusStr = '☕ In der Pause'; badgeBg = '#fef3c7'; badgeColor = '#b45309'; }
                else if (employeeDailyLog.status === 'finalizado') { statusStr = '✅ Arbeitstag beendet'; badgeBg = '#e0f2fe'; badgeColor = '#0369a1'; }
            }

            let activeBannerHtml = '';
            if (externalActiveVisit && timetrackViewMode !== 'active') {
                const clientName = externalActiveVisit.client.name;
                const clientAddress = externalActiveVisit.client.address || 'Keine Adresse';
                activeBannerHtml = `
                    <div class="active-client-banner" id="banner-goto-active">
                        <span style="font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                            🟢 Sie sind aktiv bei: ${clientName} - <span style="font-weight: 400; color: #64748b;">${clientAddress}</span>
                        </span>
                        <span style="color: #2563eb; font-weight: 700; font-size: 0.7rem; flex-shrink: 0; margin-left: 6px;">Anzeigen ➔</span>
                    </div>
                `;
            }

            const isAtLunch = employeeDailyLog && employeeDailyLog.status === 'almuerzo';
            const lunchButtonText = isAtLunch ? '▶️ Zurück aus der Pause' : '☕ Pause';
            const lunchButtonStyle = isAtLunch ? 'background:#16a34a; color:#ffffff;' : 'background:#ffedd5; color:#c2410c; border: 1px solid #fed7aa;';

            container.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <button type="button" class="icon-btn" id="btn-back-t">← Menü</button>
                    <button type="button" class="btn-active-clients" id="btn-toggle-view">🟢 Aktive Kunden</button>
                </div>

                <div class="card-box">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <strong style="font-size: 0.8rem; color: #0f172a;">🏢 Arbeitstag</strong>
                        <span style="background: ${badgeBg}; color: ${badgeColor}; padding: 2px 8px; border-radius: 6px; font-size: 0.68rem; font-weight: 700;">${statusStr}</span>
                    </div>

                    <div class="timer-display" id="global-timer">00:00:00</div>

                    <div class="btn-group">

        function renderClientsList(appts, map) {
            const listContainer = document.getElementById('clients-timetrack-list');

                    const primary = a.assigned_employee.split(',')[0].trim().toLowerCase();
                    return primary === selectedEmployee.toLowerCase();

                filteredAppts = appts.filter(a => activeApptIds.has(String(a.id)) && map.has(a.client_id));

                    });
                    
                    badge = `<span style="background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; padding: 2px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 700;" class="visit-timer-badge" data-start-ms="${earliestMs}">🟢 00:00:00</span>`;
                    
                    if (timetrackViewMode === 'assigned') {
                        if (amActiveInVisit) {
                            actionBtn = `<button type="button" class="btn btn-danger btn-checkout" data-id="${appt.id}" style="padding: 8px; font-size: 0.7rem;">⏹️ Beenden</button>`;
                        } else {
                            actionBtn = `<button type="button" class="btn btn-success btn-join" data-id="${appt.id}" style="padding: 8px; font-size: 0.7rem;">➕ Beitreten</button>`;
                        }
                    } else {
                        if (!amActiveInVisit) {
                            actionBtn = `<button type="button" class="btn btn-success btn-join" data-id="${appt.id}" style="padding: 8px; font-size: 0.7rem;">➕ Beitreten</button>`;
                        } else {
                            actionBtn = `<button type="button" class="btn btn-danger btn-checkout" data-id="${appt.id}" style="padding: 8px; font-size: 0.7rem;">⏹️ Beenden</button>`;

        function startLiveTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const timerEl = document.getElementById('global-timer');
                if (!timerEl) return;

                if (!employeeDailyLog || !employeeDailyLog.clock_in_time || employeeDailyLog.status === 'finalizado') {
                    timerEl.textContent = "00:00:00";
                    return;
                }

                const now = new Date().getTime();
                if (employeeDailyLog.status === 'almuerzo') {
                    const lunchStart = employeeDailyLog.lunch_start_time ? parseTimestampToMs(employeeDailyLog.lunch_start_time) : now;
                    let diff = Math.floor((now - lunchStart) / 1000); 
                    if (diff < 0) diff = 0;
                    const h = String(Math.floor(diff / 3600)).padStart(2, '0');
                    const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
                    const s = String(diff % 60).padStart(2, '0');
                    timerEl.innerHTML = `<span style="color: #b45309; font-size: 1.8rem;">☕ Pause: ${h}:${m}:${s}</span>`;
                    return;
                }

                const start = parseTimestampToMs(employeeDailyLog.clock_in_time);
                let diff = Math.floor((now - start) / 1000); 
                if (diff < 0) diff = 0;

                const h = String(Math.floor(diff / 3600)).padStart(2, '0');
                const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
                const s = String(diff % 60).padStart(2, '0');
                timerEl.textContent = `${h}:${m}:${s}`;
            }, 1000);
        }

        function startVisitLiveTimer() {
            if (visitLiveInterval) clearInterval(visitLiveInterval);
            const updateTimers = () => {
                const now = Date.now();
                document.querySelectorAll('.visit-timer-badge').forEach(badge => {
                    const startMs = parseInt(badge.getAttribute('data-start-ms'), 10);
                    if (isNaN(startMs)) return;
                    let diff = Math.floor((now - startMs) / 1000); 
                    if (diff < 0) diff = 0;
                    const h = String(Math.floor(diff / 3600)).padStart(2, '0');
                    const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
                    const s = String(diff % 60).padStart(2, '0');
                    badge.textContent = `🟢 ${h}:${m}:${s}`;
                });
            };
            updateTimers();
            visitLiveInterval = setInterval(updateTimers, 1000);
        }

        function attachTimetrackListeners() {
            document.getElementById('btn-start').addEventListener('click', async () => {
                const nowPure = getPureLocalTimestamp();
                try {
                    if (!employeeDailyLog) {
                        const { data, error } = await supabase.from('employee_daily_logs').insert([{ employee_name: selectedEmployee, work_date: todayStr, clock_in_time: nowPure, status: 'activo' }]).select().single();
                        if (error) throw error;
                        employeeDailyLog = data;
                    } else {
                        const { data, error } = await supabase.from('employee_daily_logs').update({ clock_in_time: nowPure, status: 'activo' }).eq('id', employeeDailyLog.id).select().single();
                        if (error) throw error;
                        employeeDailyLog = data;
                    }
                    renderTimetrackView();
                } catch (err) { alert('Fehler beim Starten: ' + err.message); }
            });

            document.getElementById('btn-lunch').addEventListener('click', async () => {
                if (!employeeDailyLog) { alert('Sie müssen zuerst Ihren Arbeitstag starten.'); return; }
                const nowPure = getPureLocalTimestamp();
                
                let isReturningFromLunch = employeeDailyLog.status === 'almuerzo';
                let updatePayload = isReturningFromLunch ? { status: 'activo', lunch_end_time: nowPure } : { status: 'almuerzo', lunch_start_time: nowPure };

                try {
                    const { data, error } = await supabase.from('employee_daily_logs').update(updatePayload).eq('id', employeeDailyLog.id).select().single();
                    if (error) throw error;
                    employeeDailyLog = data;

                    if (isReturningFromLunch && employeeDailyLog.lunch_start_time) {
                        const activeVisit = activeVisitsList.find(v => v.employee_name.toLowerCase() === selectedEmployee.toLowerCase());
                        
                        if (activeVisit) {
                            const appt = allAppointments.find(a => String(a.id) === String(activeVisit.appointment_id));
                            if (appt) {
                                const lStartMs = parseTimestampToMs(employeeDailyLog.lunch_start_time);
                                const lEndMs = parseTimestampToMs(nowPure);
                                const pauseMins = Math.max(1, Math.round((lEndMs - lStartMs) / 60000));

                                let currentDeductions = parseDeductions(appt.lunch_deductions);
                                
                                const existingIndex = currentDeductions.findIndex(d => d.employee.toLowerCase() === selectedEmployee.toLowerCase());
                                if (existingIndex >= 0) {
                                    currentDeductions[existingIndex] = {
                                        employee: selectedEmployee,
                                        lunch_start: employeeDailyLog.lunch_start_time,
                                        lunch_end: nowPure,
                                        minutes: pauseMins
                                    };
                                } else {
                                    currentDeductions.push({
                                        employee: selectedEmployee,
                                        lunch_start: employeeDailyLog.lunch_start_time,
                                        lunch_end: nowPure,
                                        minutes: pauseMins
                                    });
                                }

                                const totalLunchDeductions = currentDeductions.reduce((sum, item) => sum + item.minutes, 0);
                                const rawSessions = unifySessions(appt.sessions);
                                const grossLabor = rawSessions.reduce((sum, item) => sum + item.minutes, 0);
                                const netLabor = Math.max(0, grossLabor - totalLunchDeductions);

                                await supabase.from('appointments').update({
                                    lunch_deductions: currentDeductions,
                                    lunch_deduction_minutes: totalLunchDeductions,
                                    total_labor_minutes: netLabor
                                }).eq('id', appt.id);
                            }
                        }
                    }

                    await fetchData();
                    renderTimetrackView();
                } catch (err) { alert('Fehler bei der Pause: ' + err.message); }
            });

            document.getElementById('btn-end').addEventListener('click', async () => {
                if (!employeeDailyLog) return;
                const nowPure = getPureLocalTimestamp();
                try {
                    const { data, error } = await supabase.from('employee_daily_logs').update({ clock_out_time: nowPure, status: 'finalizado' }).eq('id', employeeDailyLog.id).select().single();
                    if (error) throw error;
                    employeeDailyLog = data;
                    renderTimetrackView();
                } catch (err) { alert('Fehler beim Beenden: ' + err.message); }
            });
        }

        const empModal = document.getElementById('employee-modal');
        const empDropdown = document.getElementById('employee-select-dropdown');
        document.getElementById('close-emp-modal').addEventListener('click', () => { empModal.style.display = 'none'; });
        document.getElementById('btn-cancel-emp').addEventListener('click', () => { empModal.style.display = 'none'; });

        document.getElementById('btn-confirm-emp').addEventListener('click', async () => {

            empModal.style.display = 'none';

            const nowPure = getPureLocalTimestamp();

            if (!error) {
                const existingVisits = activeVisitsList.filter(v => String(v.appointment_id) === String(a.id));
                if (!a.check_in_time && existingVisits.length === 0) {
                    await supabase.from('appointments').update({ check_in_time: nowPure }).eq('id', a.id);
                }
                await fetchData();
                renderTimetrackView();
            } else alert('Fehler beim Hinzufügen des Mitarbeiters: ' + error.message);
        });

        function attachClientTimerListeners() {
            document.querySelectorAll('.btn-open-add-emp').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    currentAppointmentForEmp = allAppointments.find(x => x.id === id);
                    if (!currentAppointmentForEmp) return;

                    empDropdown.innerHTML = '';
                    if (allEmployeeNames.length === 0) {
                        empDropdown.innerHTML = `<option value="">Keine Mitarbeiter registriert</option>`;
                    } else {
                        allEmployeeNames.forEach(name => {
                            const opt = document.createElement('option');
                            opt.value = name;
                            opt.textContent = `👷‍♂️ ${name}`;
                            empDropdown.appendChild(opt);
                        });
                    }
                    empModal.style.display = 'flex';
                });
            });

            document.querySelectorAll('.btn-remove-employee').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    const empToRemove = e.target.getAttribute('data-emp');
                    if (!confirm(`Möchten Sie diesen Besuch verlassen, ${empToRemove}?`)) return;

                    const a = allAppointments.find(x => x.id === id);
                    if (!a) return;

                    const clientObj = allClients.find(cl => String(cl.id) === String(a.client_id));
                    const clientName = clientObj ? clientObj.name : `Kunde #${a.client_id}`;
                    const visitRecord = activeVisitsList.find(v => String(v.appointment_id) === String(id) && v.employee_name.toLowerCase() === empToRemove.toLowerCase());
                    const nowPure = getPureLocalTimestamp();
                    let sessionMinutes = 1;

                    if (visitRecord) {
                        const startMs = parseTimestampToMs(visitRecord.check_in);
                        const diffSecs = Math.max(1, Math.round((Date.now() - startMs) / 1000));
                        sessionMinutes = Math.max(1, Math.round(diffSecs / 60));
                        await supabase.from('active_visits').delete().eq('id', visitRecord.id);
                    }

                    let rawSessions = a.sessions ? (typeof a.sessions === 'string' ? JSON.parse(a.sessions) : a.sessions) : [];
                    rawSessions.push({
                        employee: empToRemove,
                        check_in: visitRecord ? visitRecord.check_in : nowPure,
                        check_out: nowPure,
                        minutes: sessionMinutes
                    });
                    let sessions = unifySessions(rawSessions);

                    let deductions = parseDeductions(a.lunch_deductions);
                    const totalLunchDeductions = deductions.reduce((sum, item) => sum + item.minutes, 0);
                    const grossLabor = sessions.reduce((sum, item) => sum + item.minutes, 0);
                    const netLabor = Math.max(0, grossLabor - totalLunchDeductions);

                    const remainingActive = activeVisitsList.filter(v => String(v.appointment_id) === String(id) && v.employee_name.toLowerCase() !== empToRemove.toLowerCase());
                    let earliestCheckIn = a.check_in_time;
                    if (!earliestCheckIn && visitRecord) earliestCheckIn = visitRecord.check_in;

                    let updateData = {
                        sessions: sessions,
                        lunch_deductions: deductions,
                        lunch_deduction_minutes: totalLunchDeductions,
                        total_labor_minutes: netLabor,
                        check_in_time: earliestCheckIn
                    };

                    if (remainingActive.length === 0) {
                        updateData.check_out_time = nowPure;
                        updateData.visit_duration_minutes = Math.max(1, Math.round((Date.now() - parseTimestampToMs(earliestCheckIn || nowPure)) / 60000));
                        updateData.client_name = clientName;
                        updateData.status = 'Completado';
                    }

                    const { error } = await supabase.from('appointments').update(updateData).eq('id', id);

                    if (!error) {
                        await fetchData();
                        renderTimetrackView();
                    } else alert('Fehler beim Entfernen des Mitarbeiters: ' + error.message);
                });
            });

            document.querySelectorAll('.btn-join').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    const a = allAppointments.find(x => x.id === id);
                    if (!a) return;

                    const nowPure = getPureLocalTimestamp();
                    const { error } = await supabase.from('active_visits').insert([{ appointment_id: a.id, client_id: a.client_id, employee_name: selectedEmployee, check_in: nowPure }]);
                    if (!error) {
                        const existingVisits = activeVisitsList.filter(v => String(v.appointment_id) === String(a.id));
                        if (!a.check_in_time && existingVisits.length === 0) {
                            await supabase.from('appointments').update({ check_in_time: nowPure }).eq('id', a.id);
                        }
                        await fetchData();
                        renderTimetrackView();
                    } else alert('Fehler beim Beitreten: ' + error.message);
                });
            });

            document.querySelectorAll('.btn-checkin').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    const nowPure = getPureLocalTimestamp();
                    const a = allAppointments.find(x => x.id === id);
                    if (!a) return;

                    const { error } = await supabase.from('active_visits').insert([{ appointment_id: a.id, client_id: a.client_id, employee_name: selectedEmployee, check_in: nowPure }]);
                    if (!error) {
                        await supabase.from('appointments').update({ check_in_time: a.check_in_time || nowPure }).eq('id', a.id);
                        await fetchData();
                        renderTimetrackView();
                    } else alert('Fehler: ' + error.message);
                });
            });

            document.querySelectorAll('.btn-checkout').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    const a = allAppointments.find(x => x.id === id);
                    if (!a) return;

                    const apptVisits = activeVisitsList.filter(v => String(v.appointment_id) === String(id));
                    const otherActiveEmps = apptVisits.filter(v => v.employee_name.toLowerCase() !== selectedEmployee.toLowerCase());

                    if (otherActiveEmps.length > 0) {
                        const otherNames = otherActiveEmps.map(v => v.employee_name).join(', ');
                        const proceed = confirm(
                            `⚠️ Hinweis zum Abschluss\n\n` +
                            `Derzeit sind noch Kollegen bei diesem Kunden aktiv: [ ${otherNames} ].\n\n` +
                            `Wenn nur Sie Ihre Arbeit beendet haben und die anderen bleiben, klicken Sie auf "Abbrechen" und nutzen Sie das (×) neben Ihrem Namen, um sich auszutragen.\n\n` +
                            `Möchten Sie den Besuch jetzt wirklich für ALLE Kollegen abschließen?`
                        );
                        if (!proceed) return;
                    } else {
                        const confirmSingle = confirm(`Sind Sie sicher, dass Sie diesen Besuch beenden und schließen möchten?`);
                        if (!confirmSingle) return;
                    }

                    const clientObj = allClients.find(cl => String(cl.id) === String(a.client_id));
                    const clientName = clientObj ? clientObj.name : `Kunde #${a.client_id}`;
                    const nowPure = getPureLocalTimestamp();
                    let rawSessions = a.sessions ? (typeof a.sessions === 'string' ? JSON.parse(a.sessions) : a.sessions) : [];

                    for (let v of apptVisits) {
                        const startMs = parseTimestampToMs(v.check_in);
                        const diffSecs = Math.max(1, Math.round((Date.now() - startMs) / 1000));
                        const sessionMins = Math.max(1, Math.round(diffSecs / 60));

                        rawSessions.push({
                            employee: v.employee_name,
                            check_in: v.check_in,
                            check_out: nowPure,
                            minutes: sessionMins
                        });
                        await supabase.from('active_visits').delete().eq('id', v.id);
                    }

                    let sessions = unifySessions(rawSessions);
                    let deductions = parseDeductions(a.lunch_deductions);
                    const totalLunchDeductions = deductions.reduce((sum, item) => sum + item.minutes, 0);
                    const grossLabor = sessions.reduce((sum, item) => sum + item.minutes, 0);
                    const netLabor = Math.max(0, grossLabor - totalLunchDeductions);

                    let earliestCheckIn = a.check_in_time;
                    if (!earliestCheckIn && apptVisits.length > 0) earliestCheckIn = apptVisits[0].check_in;

                    const updatePayload = {
                        sessions: sessions,
                        lunch_deductions: deductions,
                        lunch_deduction_minutes: totalLunchDeductions,
                        total_labor_minutes: netLabor,
                        check_in_time: earliestCheckIn,
                        check_out_time: nowPure,
                        visit_duration_minutes: apptVisits.length > 0 ? Math.max(1, Math.round((Date.now() - parseTimestampToMs(earliestCheckIn || apptVisits[0].check_in)) / 60000)) : 1,
                        client_name: clientName,
                        status: 'Completado'
                    };

                    const { error } = await supabase.from('appointments').update(updatePayload).eq('id', id);

                    if (!error) {
                        await fetchData();
                        renderTimetrackView();
                    } else alert('Fehler beim Schließen des Besuchs: ' + error.message);
                });
            });
        }

        init();
    </script>
</body>
