<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClientSync | Zeiten-Korrektur</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 16px; 
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 90vh;
        }

        .container { 
            width: 100%;
            max-width: 480px; 
            margin: 0 auto; 
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.05);
        }

        .btn-back {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-admin {
            font-size: 0.68rem;
            background: #fff7ed;
            color: #c2410c;
            border: 1px solid #ffedd5;
            padding: 3px 10px;
            border-radius: 8px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        input, select {
            font-family: inherit;
            font-size: 0.85rem;
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background: #f8fafc;
            outline: none;
            color: #0f172a;
            font-weight: 600;
        }
        select:focus, input:focus {
            border-color: #0f172a;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.05);
        }

        .employee-row {
            display: grid;
            grid-template-columns: 2fr 2fr 2fr 40px;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .btn-action {
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 13px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn-green { background: #15803d; color: white; box-shadow: 0 4px 12px rgba(21, 128, 61, 0.2); }
        .btn-green:hover { opacity: 0.95; }
        .btn-add { background: #f1f5f9; color: #334155; border: 1px dashed #cbd5e1; margin-top: 6px; }
        .btn-danger { background: #fee2e2; color: #dc2626; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 700; }
        
        #statusMessage {
            margin-top: 12px;
            font-size: 0.78rem;
            font-weight: 700;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ENCABEZADO -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <a href="./index.html" class="btn-back">← Zurück</a>
                <span class="badge-admin">Admin Level 3</span>
            </div>

            <h1 style="font-size: 1.1rem; font-weight: 800; margin: 0 0 4px 0; color: #0f172a;">Zeiten-Korrektur</h1>
            <p style="font-size: 0.75rem; color: #64748b; margin: 0 0 16px 0;">Termine und Mitarbeiterzeiten manuell anpassen</p>
            
            <div class="form-group" style="margin-bottom: 0;">
                <label>Termin auswählen (Kunde / Datum):</label>
                <select id="selectTermin">
                    <option value="">-- Termin laden --</option>
                </select>
            </div>
        </div>

        <!-- FORMULARIO DE EDICIÓN -->
        <div class="card" id="cardEdicion" style="opacity: 0.4; pointer-events: none;">
            <input type="hidden" id="terminId">
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label>Kunde:</label>
                    <input type="text" id="txtKunde" readonly style="background: #e2e8f0; color: #475569;">
                </div>
                <div class="form-group">
                    <label>Datum:</label>
                    <input type="date" id="txtFecha" readonly style="background: #e2e8f0; color: #475569;">
                </div>
            </div>

            <label style="margin-top: 10px;">Mitarbeiter & Arbeitszeiten:</label>
            <div id="empleadosContainer">
                <!-- Se llenará dinámicamente -->
            </div>
            <button type="button" class="btn-action btn-add" onclick="agregarFilaEmpleado()">+ Mitarbeiter hinzufügen</button>

            <div style="margin-top: 20px;">
                <button type="button" id="btnGuardar" class="btn-action btn-green">💾 Änderungen in Supabase speichern</button>
            </div>
            <div id="statusMessage"></div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabaseClient.js';

        const selectTermin = document.getElementById('selectTermin');
        const cardEdicion = document.getElementById('cardEdicion');
        const terminId = document.getElementById('terminId');
        const txtKunde = document.getElementById('txtKunde');
        const txtFecha = document.getElementById('txtFecha');
        const empleadosContainer = document.getElementById('empleadosContainer');
        const btnGuardar = document.getElementById('btnGuardar');
        const statusMessage = document.getElementById('statusMessage');

        let listaTerminos = [];
        let empleadosActuales = [];
        const listaEmpleadosDisponibles = ["Nick", "Ute", "Pezi", "Ramiro", "Tini", "Kilian", "Pixi"];

        async function cargarTerminosRecientes() {
            try {
                selectTermin.innerHTML = '<option value="">Termine werden geladen...</option>';
                
                const { data, error } = await supabase
                    .from('appointments')
                    .select('id, client_name, scheduled_date, sessions, check_in_time, check_out_time, assigned_employee')
                    .order('scheduled_date', { ascending: false })
                    .limit(50);

                if (error) throw error;

                listaTerminos = data || [];
                selectTermin.innerHTML = '<option value="">-- Termin auswählen --</option>';
                
                if (listaTerminos.length === 0) {
                    selectTermin.innerHTML = '<option value="">-- Keine Termine gefunden --</option>';
                    return;
                }

                listaTerminos.forEach(t => {
                    const option = document.createElement('option');
                    option.value = t.id;
                    const cliente = t.client_name || 'Kein Kunde';
                    const fecha = t.scheduled_date || 'Kein Datum';
                    option.textContent = `${fecha} - ${cliente}`;
                    selectTermin.appendChild(option);
                });
            } catch (err) {
                console.error('Fehler beim Laden:', err);
                selectTermin.innerHTML = '<option value="">Fehler beim Laden der Termine</option>';
            }
        }

        selectTermin.addEventListener('change', (e) => {
            const idSeleccionado = e.target.value;
            if (!idSeleccionado) {
                cardEdicion.style.opacity = '0.4';
                cardEdicion.style.pointerEvents = 'none';
                return;
            }

            const termin = listaTerminos.find(t => t.id === idSeleccionado);
            if (!termin) return;

            terminId.value = termin.id;
            txtKunde.value = termin.client_name || '';
            txtFecha.value = termin.scheduled_date || '';

            empleadosActuales = [];
            if (termin.sessions && Array.isArray(termin.sessions) && termin.sessions.length > 0) {
                termin.sessions.forEach(s => {
                    empleadosActuales.push({
                        name: s.employee || '',
                        checkIn: s.check_in ? s.check_in.slice(11, 16) : '08:00',
                        checkOut: s.check_out ? s.check_out.slice(11, 16) : '12:00'
                    });
                });
            } else if (termin.assigned_employee) {
                empleadosActuales.push({
                    name: termin.assigned_employee,
                    checkIn: termin.check_in_time ? termin.check_in_time.slice(11, 16) : '08:00',
                    checkOut: termin.check_out_time ? termin.check_out_time.slice(11, 16) : '12:00'
                });
            }

            renderizarEmpleados();
            cardEdicion.style.opacity = '1';
            cardEdicion.style.pointerEvents = 'auto';
            statusMessage.textContent = '';
        });

        window.agregarFilaEmpleado = function() {
            empleadosActuales.push({ name: "Nick", checkIn: "08:30", checkOut: "12:30" });
            sincronizarDesdeDOM();
            renderizarEmpleados();
        }

        window.eliminarFilaEmpleado = function(index) {
            sincronizarDesdeDOM();
            empleadosActuales.splice(index, 1);
            renderizarEmpleados();
        }

        function sincronizarDesdeDOM() {
            const filas = empleadosContainer.querySelectorAll('.employee-row');
            empleadosActuales = [];
            filas.forEach(fila => {
                empleadosActuales.push({
                    name: fila.querySelector('.emp-name').value,
                    checkIn: fila.querySelector('.emp-in').value,
                    checkOut: fila.querySelector('.emp-out').value
                });
            });
        }

        function renderizarEmpleados() {
            empleadosContainer.innerHTML = '';
            empleadosActuales.forEach((emp, index) => {
                const div = document.createElement('div');
                div.className = 'employee-row';
                
                let optionsEmp = '';
                listaEmpleadosDisponibles.forEach(nombre => {
                    optionsEmp += `<option value="${nombre}" ${emp.name === nombre ? 'selected' : ''}>${nombre}</option>`;
                });

                div.innerHTML = `
                    <select class="emp-name">${optionsEmp}</select>
                    <input type="time" value="${emp.checkIn}" class="emp-in" />
                    <input type="time" value="${emp.checkOut}" class="emp-out" />
                    <button type="button" class="btn-danger" onclick="eliminarFilaEmpleado(${index})">✕</button>
                `;
                empleadosContainer.appendChild(div);
            });
        }

        btnGuardar.addEventListener('click', async () => {
            sincronizarDesdeDOM();
            const id = terminId.value;
            const fecha = txtFecha.value;

            if (empleadosActuales.length === 0) {
                alert('Es muss mindestens ein Mitarbeiter erfasst sein.');
                return;
            }

            btnGuardar.disabled = true;
            statusMessage.style.color = '#6366f1';
            statusMessage.textContent = 'Wird gespeichert...';

            let minCheckInMin = null;
            let maxCheckOutMin = null;
            let totalLaborMinutes = 0;
            let sessionsArray = [];

            empleadosActuales.forEach(emp => {
                if (!emp.checkIn || !emp.checkOut) return;

                const [inH, inM] = emp.checkIn.split(':').map(Number);
                const [outH, outM] = emp.checkOut.split(':').map(Number);

                const inTotal = inH * 60 + inM;
                const outTotal = outH * 60 + outM;
                const diff = outTotal - inTotal;

                if (diff > 0) {
                    totalLaborMinutes += diff;
                    if (minCheckInMin === null || inTotal < minCheckInMin) minCheckInMin = inTotal;
                    if (maxCheckOutMin === null || outTotal > maxCheckOutMin) maxCheckOutMin = outTotal;

                    sessionsArray.push({
                        minutes: diff,
                        check_in: `${fecha}T${emp.checkIn}:00`,
                        employee: emp.name,
                        check_out: `${fecha}T${emp.checkOut}:00`
                    });
                }
            });

            const visitDuration = (minCheckInMin !== null && maxCheckOutMin !== null) ? (maxCheckOutMin - minCheckInMin) : 0;
            const globalCheckIn = `${fecha} ${Math.floor(minCheckInMin/60).toString().padStart(2,'0')}:${(minCheckInMin%60).toString().padStart(2,'0')}:00`;
            const globalCheckOut = `${fecha} ${Math.floor(maxCheckOutMin/60).toString().padStart(2,'0')}:${(maxCheckOutMin%60).toString().padStart(2,'0')}:00`;

            try {
                const { error } = await supabase
                    .from('appointments')
                    .update({
                        check_in_time: globalCheckIn,
                        check_out_time: globalCheckOut,
                        visit_duration_minutes: visitDuration,
                        total_labor_minutes: totalLaborMinutes,
                        sessions: sessionsArray
                    })
                    .eq('id', id);

                if (error) throw error;

                statusMessage.style.color = '#15803d';
                statusMessage.textContent = '✔ Erfolgreich aktualisiert!';
                setTimeout(() => { statusMessage.textContent = ''; }, 3000);
            } catch (err) {
                console.error(err);
                statusMessage.style.color = '#dc2626';
                statusMessage.textContent = '✖ Fehler beim Speichern der Daten.';
            } finally {
                btnGuardar.disabled = false;
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            cargarTerminosRecientes();
        });
    </script>
</body>
</html>
