<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClientSync | Zonas y Citas</title>
    <link rel="stylesheet" href="./css/main.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7fafc;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 10px;
            box-sizing: border-box;
        }
        /* Mapa responsivo adaptado para altura de móviles */
        #map {
            width: 100%;
            height: 65vh; /* Ocupa el 65% de la altura de la pantalla del móvil */
            min-height: 400px;
            border-radius: 8px;
            border: 1px solid #cbd5e0;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .nav-buttons a {
            flex: 1;
            text-align: center;
            min-width: 140px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            box-sizing: border-box;
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="margin-bottom: 15px; color: #2d3748;">ClientSync | WerkSolutions</h1>

        <!-- Botones de navegación táctiles y grandes para móvil -->
        <div class="nav-buttons">
            <a href="./zone-builder.html" style="background: #2b6cb0;">
                🗺️️ Zonas
            </a>
            <a href="./client-builder.html" style="background: #d69e2e;">
                🏢 Nuevo Cliente
            </a>
        </div>

        <!-- Filtro superior -->
        <div class="filter-section" style="margin-bottom: 15px;">
            <label for="filter-employee" style="font-size: 0.9rem; font-weight: bold; color: #4a5568;">Filtrar por técnico:</label><br>
            <select id="filter-employee" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #cbd5e0; background: white;">
                <option value="all">Todo el equipo</option>
            </select>
        </div>

        <!-- Sección del Mapa -->
        <section class="map-section" style="background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
            <h2 style="margin-top: 0; font-size: 1.1rem; color: #2d3748;">Ubicación y Zonas de Trabajo</h2>
            <div id="map"></div>
        </section>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC4uaDGEnYaYHBqxhcCGyKA2uTAyJmwRZQ" async defer></script>

    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/map.js"></script>

</body>
</html>
