<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClientSync | WerkSolutions Zonas y Citas</title>
    <!-- Tus estilos principales -->
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>

    <div class="container">
        <h1>ClientSync | WerkSolutions Zonas y Citas</h1>

        <!-- Botón para abrir la aplicación externa de carga de zonas -->
        <div style="margin-bottom: 20px;">
            <a href="./zone-builder.html" style="display: inline-block; padding: 10px 18px; background: #2b6cb0; color: white; text-decoration: none; border-radius: 6px; font-weight: bold;">
                🗺️ Abrir Herramienta de Delimitación de Zonas
            </a>
        </div>

        <!-- Filtro superior -->
        <div class="filter-section">
            <label for="filter-employee">Filtrar por técnico:</label>
            <select id="filter-employee">
                <option value="all">Todo el equipo</option>
            </select>
        </div>

        <!-- Gestión del Equipo -->
        <section class="team-section">
            <h2>Gestión del Equipo</h2>
            
            <form id="employee-form" class="employee-form">
                <input type="text" id="emp-name" placeholder="Nombre y Apellido" required>
                <input type="email" id="emp-email" placeholder="correo@werksolutions.de" required>
                <select id="emp-role">
                    <option value="Técnico">Técnico</option>
                    <option value="Administrador">Administrador</option>
                </select>
                <button type="submit">Registrar Empleado</button>
            </form>

            <ul id="employees-list" class="employees-list">
                <!-- Los empleados se cargarán dinámicamente aquí -->
            </ul>
        </section>

        <!-- Sección del Mapa de Google Maps -->
        <section class="map-section">
            <h2>Ubicación y Zonas de Trabajo</h2>
            <div id="map"></div>
        </section>
    </div>

    <!-- Carga de la API de Google Maps -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC4uaDGEnYaYHBqxhcCGyKA2uTAyJmwRZQ" async defer></script>

    <!-- Scripts de la aplicación -->
    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/map.js"></script>

</body>
</html>
