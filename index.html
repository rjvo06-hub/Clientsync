<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArbeitsTime - Control de Tiempos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>ArbeitsTime</h1>
            <p>Control de horas y carga de trabajo</p>
        </header>

        <main>
            <!-- Sección de Resumen / Filtro de Fechas -->
            <section class="card">
                <h2>Vista de Jornadas</h2>
                <div class="date-selector">
                    <label for="filtro-fecha">Seleccionar Día:</label>
                    <input type="date" id="filtro-fecha">
                </div>
            </section>

            <!-- Contenedor del Semáforo del Día -->
            <section class="card">
                <h2>Estado de la Jornada</h2>
                <div id="indicador-semaforo" class="semaforo-card semaforo-green">
                    <span id="semaforo-texto-estado" class="semaforo-texto">🟢 Disponible</span>
                    <span id="semaforo-detalle-clientes" class="semaforo-detalle">0 clientes registrados</span>
                </div>
            </section>

            <!-- Listado de Clientes del Día -->
            <section class="card">
                <h2>Clientes del Día</h2>
                <div id="lista-clientes-dia">
                    <!-- Los registros se cargan dinámicamente aquí -->
                </div>
            </section>
        </main>
    </div>

    <!-- Script principal de la aplicación -->
    <script src="app.js"></script>
</body>
</html>
