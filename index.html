<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClientSync | Iniciar Sesión</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --border-subtle: #e2e8f0;
            --radius-xl: 16px;
            --radius-md: 10px;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-sizing: border-box;
        }

        /* Header Minimalista */
        .app-header {
            text-align: center;
            margin-bottom: 6px;
        }

        .app-header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            margin: 0 0 4px 0;
            letter-spacing: -0.3px;
            color: #0f172a;
        }

        .badge-brand {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-secondary);
            background: #f1f5f9;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
        }

        /* Tarjeta de Login */
        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            padding: 24px;
            border-radius: var(--radius-xl);
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
        }

        select, input {
            font-size: 15px;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            background: #f8fafc;
            outline: none;
            color: #1e293b;
            font-weight: 600;
            box-sizing: border-box;
        }

        .btn-login {
            background: #2563eb;
            color: white;
            font-size: 0.9rem;
            font-weight: bold;
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background: #1d4ed8;
        }

        /* Menú Principal (Oculto hasta hacer login) */
        #main-menu-container {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        /* Sección de navegación */
        .nav-section-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 4px 0 2px 4px;
        }

        .nav-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-subtle);
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        .nav-buttons a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 14px 8px;
            border-radius: var(--radius-md);
            font-weight: 700;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.78rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
            text-align: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .nav-buttons a:hover {
            background: #eff6ff;
            color: #2563eb;
            border-color: #bfdbfe;
        }

        .nav-buttons a span {
            font-size: 1.5rem;
        }

        .user-welcome-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            padding: 12px 16px;
            border-radius: var(--radius-xl);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header minimalista -->
        <header class="app-header">
            <h1>ClientSync</h1>
            <span class="badge-brand">WerkSolutions Portal</span>
        </header>

        <!-- SECCIÓN 1: PANTALLA DE LOGIN -->
        <div id="login-section" class="login-card">
            <h2 style="font-size: 1.05rem; margin-top: 0; color: #1e293b; margin-bottom: 14px; text-align: center;">🔐 Iniciar Sesión</h2>
            
            <form id="login-form">
                <div class="form-group">
                    <label>Selecciona tu Usuario:</label>
                    <select id="login-employee" required>
                        <option value="">-- Elige quién eres --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login" id="btn-submit-login">Entrar al Sistema</button>
            </form>
        </div>

        <!-- SECCIÓN 2: MENÚ PRINCIPAL (Aparece al iniciar sesión correctamente) -->
        <div id="main-menu-container">
            <div class="user-welcome-bar">
                <div>
                    <span style="font-size: 0.7rem; color: #64748b; display: block; font-weight: 600;">Bienvenido(a),</span>
                    <strong id="logged-user-name" style="font-size: 0.95rem; color: #1e293b;">...</strong>
                </div>
                <button type="button" id="btn-logout" style="background: #fee2e2; color: #991b1b; border: none; padding: 6px 10px; border-radius: 8px; font-size: 0.72rem; font-weight: bold; cursor: pointer;">🚪 Cerrar Sesión</button>
            </div>

            <!-- Portal de Empleado (Visible para todos) -->
            <div>
                <div class="nav-section-title">Portal de Trabajo</div>
                <nav class="nav-buttons" style="grid-template-columns: 1fr;">
                    <a href="#" id="link-employee-portal" style="background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; flex-direction: row; justify-content: flex-start; padding: 12px 16px; gap: 12px;">
                        <span style="font-size: 1.3rem;">👷‍♂️</span>
                        <div style="text-align: left;">
                            <div style="font-size: 0.88rem; font-weight: 800;">Mi Portal de Citas y Ruta</div>
                            <div style="font-size: 0.7rem; color: #3b82f6; font-weight: 600;">Gestiona tus visitas y tiempos diarios</div>
                        </div>
                    </a>
                </nav>
            </div>

            <!-- Panel de Administración (Visible solo para administradores) -->
            <div id="admin-section-container" style="display: none;">
                <div class="nav-section-title">Panel de Administración</div>
                <nav class="nav-buttons">
                    <a href="./client-builder.html"><span>🏢</span> Clientes</a>
                    <a href="./appointment-builder.html"><span>📅</span> Agendar Citas</a>
                    <a href="./admin-assignments.html"><span>🛠️</span> Administrador</a>
                    <a href="./employee-builder.html"><span>👨‍🔧</span> Empleados</a>
                    <a href="#" id="link-client-map" style="grid-column: span 2; flex-direction: row; justify-content: center; gap: 8px; background: #f8fafc;"><span>🗺️</span> Mapa General de Clientes</a>
                    <a href="./admin-pdf.html" id="navAdminPdf" style="grid-column: span 2; background: #faf5ff; color: #7c3aed; border-color: #c084fc; flex-direction: row; justify-content: center; gap: 8px;"><span>📄</span> Reporte PDF Gerencial</a>
                </nav>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabaseClient.js';

        const STORAGE_KEY = 'clientSync_saved_employee';
        const LEVEL_KEY = 'clientSync_user_level';

        let employeesList = [];

        const loginSection = document.getElementById('login-section');
        const mainMenuContainer = document.getElementById('main-menu-container');
        const employeeSelect = document.getElementById('login-employee');
        const passwordInput = document.getElementById('login-password');
        const loginForm = document.getElementById('login-form');
        const loggedUserName = document.getElementById('logged-user-name');
        const btnLogout = document.getElementById('btn-logout');

        const linkTeam = document.getElementById('link-employee-portal');
        const linkMap = document.getElementById('link-client-map');
        const adminSectionContainer = document.getElementById('admin-section-container');
        const pdfLink = document.getElementById('navAdminPdf');

        async function initApp() {
            try {
                const { data, error } = await supabase.from('employees').select('*').order('name', { ascending: true });
                if (error) throw error;

                employeesList = data || [];
                employeesList.forEach(emp => {
                    employeeSelect.innerHTML += `<option value="${emp.name}">${emp.name}</option>`;
                });

                // Verificar si ya hay sesión activa en localStorage
                const savedEmp = localStorage.getItem(STORAGE_KEY);
                if (savedEmp && employeesList.some(e => e.name === savedEmp)) {
                    showMainDashboard(savedEmp);
                }
            } catch (err) {
                console.error('Error al cargar empleados:', err);
            }
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const selectedName = employeeSelect.value;
            const enteredPassword = passwordInput.value.trim();

            const employeeObj = employeesList.find(e => e.name === selectedName);

            if (!employeeObj) {
                alert('Por favor selecciona un usuario válido.');
                return;
            }

            // Validar contraseña (si el empleado tiene contraseña registrada en la BD)
            const dbPassword = employeeObj.password ? String(employeeObj.password).trim() : '';

            if (dbPassword !== '' && dbPassword !== enteredPassword) {
                alert('Contraseña incorrecta. Inténtalo de nuevo.');
                passwordInput.value = '';
                return;
            }

            // Guardar sesión y nivel
            localStorage.setItem(STORAGE_KEY, employeeObj.name);
            localStorage.setItem(LEVEL_KEY, employeeObj.user_level || 1);

            showMainDashboard(employeeObj.name);
        });

        function showMainDashboard(empName) {
            loginSection.style.display = 'none';
            mainMenuContainer.style.display = 'flex';
            loggedUserName.textContent = empName;

            // Actualizar enlaces dinámicos con el empleado
            linkTeam.href = `./employee-schedule.html?employee=${encodeURIComponent(empName)}`;
            linkMap.href = `./employee-route.html?employee=${encodeURIComponent(empName)}&date=${new Date().toISOString().split('T')[0]}`;

            // Validar nivel de usuario para mostrar u ocultar la sección de administración
            const userLevel = Number(localStorage.getItem(LEVEL_KEY)) || 1;
            const accesoAdmin = localStorage.getItem('usuario_acceso');

            if (userLevel >= 3 || Number(accesoAdmin) === 1) {
                adminSectionContainer.style.display = 'block';
                if (pdfLink) pdfLink.style.display = 'flex';
            } else {
                adminSectionContainer.style.display = 'none';
            }
        }

        btnLogout.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(LEVEL_KEY);
            passwordInput.value = '';
            employeeSelect.value = '';
            mainMenuContainer.style.display = 'none';
            loginSection.style.display = 'block';
        });

        window.addEventListener('DOMContentLoaded', () => {
            initApp();
        });
    </script>
</body>
</html>
