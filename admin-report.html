<!DOCTYPE html>
<html lang="de">
<head>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        .filter-card {

            gap: 6px;

        }

        label {
            font-size: 0.78rem;

        select, input {

        .grid-with-spacers {

            width: 100%;
            align-items: center;

        .grid-with-spacers .col-1 { grid-column: 2; }
        .grid-with-spacers .col-2 { grid-column: 4; }

        .single-date-grid {
            display: grid;
            grid-template-columns: 8px minmax(0, 1fr) 8px;
            width: 100%;
            align-items: center;
        }
        .single-date-grid .col-single { grid-column: 2; }

        .btn-query {

        .advanced-range-toggle {

        #range-container {

        /* Contenedor del botón PDF (Oculto por defecto con display: none) */

        .btn-pdf {

            border: 1px solid #dc2626;

            border: 1px solid #e2e8f0;

            padding: 20px;

        .employee-summary-header {

        .employee-info-right {

            font-size: 0.65rem;

            border-radius: 8px;

            text-transform: uppercase;

            flex-shrink: 0;

        .metrics-calc-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #f1f5f9;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.76rem;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .metrics-calc-line .calc-left { text-align: left; }
        .metrics-calc-line .calc-center { text-align: center; color: #d97706; }
        .metrics-calc-line .calc-right { text-align: right; }

        details.accordion-visits {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 14px;
        }

        details.accordion-visits summary {
            font-size: 0.75rem;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            cursor: pointer;
            outline: none;
            list-style: none;
            letter-spacing: 0.03em;
        }

        details.accordion-visits summary::-webkit-details-marker { display: none; }
        details.accordion-visits summary::after {
            content: ' ▼';
            font-size: 0.6rem;
            float: right;
            transition: transform 0.2s;
        }
        details.accordion-visits[open] summary::after { transform: rotate(180deg); }

        .visit-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }

        .visit-item {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;

        .visit-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .team-details-list {

        .lunch-deduction-banner {

        .time-pill { font-weight: 700; }

<body>

    <div class="container">
        <div class="header">
            <h1>📊 Arbeitszeit-Audit</h1>
            <a href="./index.html" class="icon-btn">← Menü</a>
        </div>

        <!-- Filter Card -->
        <div class="filter-card">
            <div class="form-group">
                <label>Mitarbeiter (Schnellfilter):</label>
                <select id="filter-employee">
                    <option value="ALL">Alle Mitarbeiter</option>
                </select>
            </div>

            <div class="form-group" id="single-date-group">
                <label>📅 Abfragedatum:</label>
                <div class="single-date-grid">
                    <div class="col-single">
                        <input type="date" id="filter-single-date">
                    </div>
                </div>
            </div>

            <button type="button" class="advanced-range-toggle" id="btn-toggle-range">📅 Nach Zeitraum abfragen (Woche / Monat)</button>

            <div id="range-container">
                <div class="grid-with-spacers">
                    <div class="form-group col-1">
                        <label>Von:</label>
                        <input type="date" id="filter-start-date">
                    </div>
                    <div class="form-group col-2">
                        <label>Bis:</label>
                        <input type="date" id="filter-end-date">
                    </div>
                </div>
            </div>

            <button type="button" class="btn-query" id="btn-search">🔍 Datensätze abfragen</button>
        </div>

        <!-- Reiter / Tabs -->
        <div class="tabs-row">
            <button type="button" class="tab-btn active" id="tab-employees" onclick="switchView('employees')">👥 Ansicht nach Mitarbeitern</button>
            <button type="button" class="tab-btn" id="tab-clients" onclick="switchView('clients')">🏢 Ansicht nach Kunden</button>
        </div>

        <!-- Contenedor del Botón de PDF -->
        <div class="pdf-action-row" id="pdf-button-wrapper">
            <button type="button" class="btn-pdf" id="btn-export-pdf">📄 PDF Generieren</button>
        </div>

        <div id="report-results" class="report-section">
            <div style="text-align: center; padding: 30px; color: #64748b; background: #ffffff; border-radius: 24px; font-size: 0.8rem; border: 1px solid #e2e8f0;">
                Wählen Sie das Datum aus und klicken Sie auf "Datensätze abfragen".
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabaseClient.js';
        import { generateEmployeePDF } from './js/pdfGenerator.js';
        import { generateClientPDF } from './js/pdfGeneratorClient.js';

        const employeeSelect = document.getElementById('filter-employee');
        const singleDateInput = document.getElementById('filter-single-date');
        const startDateInput = document.getElementById('filter-start-date');
        const endDateInput = document.getElementById('filter-end-date');
        const btnSearch = document.getElementById('btn-search');
        const btnToggleRange = document.getElementById('btn-toggle-range');
        const btnExportPdf = document.getElementById('btn-export-pdf');
        const pdfButtonWrapper = document.getElementById('pdf-button-wrapper');
        const rangeContainer = document.getElementById('range-container');
        const reportResults = document.getElementById('report-results');

        let useRange = false;
        let currentView = 'employees';
        let cachedData = { logs: [], appts: [], clientsMap: new Map() };

        window.switchView = function(view) {
            currentView = view;
            document.getElementById('tab-employees').classList.toggle('active', view === 'employees');
            document.getElementById('tab-clients').classList.toggle('active', view === 'clients');

            if (view === 'employees') {
                pdfButtonWrapper.style.justifyContent = 'flex-start'; // Lado Izquierdo
            } else {
                pdfButtonWrapper.style.justifyContent = 'flex-end';   // Lado Derecho
            }

            renderCurrentView();
        };

        const nowLocalDate = new Date();
        const todayStr = `${nowLocalDate.getFullYear()}-${String(nowLocalDate.getMonth() + 1).padStart(2, '0')}-${String(nowLocalDate.getDate()).padStart(2, '0')}`;
        singleDateInput.value = todayStr;
        startDateInput.value = todayStr;
        endDateInput.value = todayStr;

        btnToggleRange.addEventListener('click', () => {
            useRange = !useRange;
            if (useRange) {
                rangeContainer.style.display = 'block';
                btnToggleRange.textContent = '📅 Zeitraum ausblenden und Einzeltag verwenden';
            } else {
                rangeContainer.style.display = 'none';
                btnToggleRange.textContent = '📅 Nach Zeitraum abfragen (Woche / Monat)';
            }
        });

        function formatHoursAndMinutes(totalMinutes) {
            if (!totalMinutes || isNaN(totalMinutes) || totalMinutes <= 0) return '0m';
            const h = Math.floor(totalMinutes / 60);
            const m = totalMinutes % 60;
            if (h === 0) return `${m}m`;
            if (m === 0) return `${h}h`;
            return `${h}h ${m}m`;
        }

        function formatFlatTime(timestampStr) {
            if (!timestampStr) return '--:--';
            const parts = timestampStr.split(/[\sT]/);
            if (parts.length > 1) return parts[1].substring(0, 5);
            return timestampStr.substring(11, 16) || '--:--';
        }

        function formatDate(str) {
            if (!str) return '';
            const p = str.split('-');
            return p.length === 3 ? `${p[2]}.${p[1]}.${p[0]}` : str;
        }

        function timeToMinutes(timestampStr) {
            if (!timestampStr) return 0;
            const parts = timestampStr.split(/[\sT]/);
            const timePart = parts.length > 1 ? parts[1] : parts[0];
            const timeComponents = timePart.split(':');
            return (parseInt(timeComponents[0]) || 0) * 60 + (parseInt(timeComponents[1]) || 0);
        }

        function getFlatMinutesDifference(startStr, endStr) {
            const diff = timeToMinutes(endStr) - timeToMinutes(startStr);
            return diff > 0 ? diff : 0;
        }

        // Carga de empleados con fallback automático (Soporta tabla profiles o employee_daily_logs)
        async function init() {
            try {
                let empList = [];

                // 1. Intentar cargar desde tabla 'profiles'
                const { data: profilesData } = await supabase.from('profiles').select('full_name, name');
                if (profilesData && profilesData.length > 0) {
                    empList = profilesData.map(p => p.full_name || p.name).filter(Boolean);
                }

                // 2. Si no hay profiles, intentar cargar desde 'employees'
                if (empList.length === 0) {
                    const { data: employeesData } = await supabase.from('employees').select('name');
                    if (employeesData && employeesData.length > 0) {
                        empList = employeesData.map(e => e.name).filter(Boolean);
                    }
                }

                // 3. Fallback: Extraer nombres de trabajadores existentes en la bitácora
                if (empList.length === 0) {
                    const { data: logsData } = await supabase.from('employee_daily_logs').select('employee_name');
                    if (logsData && logsData.length > 0) {
                        empList = [...new Set(logsData.map(l => l.employee_name))].filter(Boolean);
                    }
                }

                // Llenar el selector de forma limpia
                employeeSelect.innerHTML = '<option value="ALL">Alle Mitarbeiter</option>';
                empList.sort().forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    employeeSelect.appendChild(opt);
                });

            } catch (err) {
                console.error('Error al cargar la lista de trabajadores:', err);
            }
        }

        async function loadReport() {
            const selectedEmp = employeeSelect.value;
            let startDate = singleDateInput.value;
            let endDate = singleDateInput.value;

            if (useRange) {
                startDate = startDateInput.value;
                endDate = endDateInput.value;
            }

            reportResults.innerHTML = `<div style="text-align: center; padding: 25px; color: #64748b; font-size: 0.8rem;">Datensätze werden geladen...</div>`;

            try {
                let logsQuery = supabase.from('employee_daily_logs').select('*').gte('work_date', startDate).lte('work_date', endDate).order('work_date', { ascending: false });
                if (selectedEmp !== 'ALL') {
                    logsQuery = logsQuery.eq('employee_name', selectedEmp);
                }

                let apptsQuery = supabase.from('appointments').select('*').gte
