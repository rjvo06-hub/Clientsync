<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClientSync | Termine planen</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 16px; 
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container { 
            width: 100%;
            max-width: 600px; 
            margin: 0 auto; 
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-header h1 {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 0;
            color: #0f172a;
        }

        .btn-back {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #334155;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 700;
            text-decoration: none;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.05);
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 14px;
        }

        .info-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: #475569;
            margin-bottom: 12px;
        }

        .suggestion-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 0.82rem;
        }

        .form-group { margin-bottom: 12px; }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 4px;
        }

        select, input, textarea, button {
            font-size: 0.88rem;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
            outline: none;
            color: #0f172a;
            font-weight: 600;
        }

        .btn-save {
            background: #0f172a;
            color: white;
            font-size: 0.85rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .suggestion-item-btn {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            background: #ffffff !important;
            border: 1px solid #cbd5e1 !important;
            color: #0f172a !important;
        }

        .client-search-container { position: relative; margin-bottom: 12px; }
        .client-results-dropdown {
            position: absolute;
            top: 100%;
            left: 0; right: 0;
            background: white;
            border: 1px solid #cbd5e0;
            border-radius: 0 0 10px 10px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }
        .client-result-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #edf2f7;
            font-size: 0.82rem;
        }
        .client-result-item:hover { background: #f1f5f9; }
    </style>
</head>
<body>

    <div class="container">
        <header class="app-header">
            <h1 id="page-title">📅 Termine planen</h1>
            <a href="./index.html" class="btn-back">⬅️ Menü</a>
        </header>

        <div class="card">
            <form id="appointment-form">
                <!-- 1. Búsqueda de Cliente -->
                <div class="client-search-container">
                    <label>1. Kunde suchen (Name oder Straße):</label>
                    <input type="text" id="client-search-input" placeholder="Name oder Adresse eingeben..." autocomplete="off" required>
                    <input type="hidden" id="client-select" required>
                    <div id="client-results-dropdown" class="client-results-dropdown"></div>
                </div>

                <!-- Detalle del Cliente -->
                <div id="client-details" class="info-card" style="display: none;">
                    <strong>Ausgewählter Kunde:</strong> <span id="det-name" style="color: #0284c7; font-weight: bold;">-</span><br>
                    <strong>Adresse:</strong> <span id="det-address">-</span><br>
                    <strong>Koordinaten:</strong> <span id="det-coords" style="color: #0284c7;">-</span>
                </div>

                <!-- 2. Fecha, Hora y Sugerencias de Distancia -->
                <div id="date-section" style="display: none;">
                    
                    <!-- Caja de Sugerencias por Radio de Distancia -->
                    <div id="route-suggestions" class="suggestion-box">
                        <details open>
                            <summary style="font-weight: 700; color: #15803d; cursor: pointer;">
                                💡 Vorgeschlagene Termine nach Entfernung (km)
                            </summary>
                            <div id="suggestions-list" style="margin-top: 8px;">Berechne Straßenentfernungen...</div>
                        </details>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
                        <div>
                            <label>📅 Datum:</label>
                            <input type="date" id="free-date-input" required>
                        </div>
                        <div>
                            <label>⏰ Uhrzeit:</label>
                            <input type="time" id="appointment-time" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Mitarbeiter zuweisen:</label>
                        <select id="employee-select">
                            <option value="General">Nicht zugewiesen</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Geschätzte Stunden:</label>
                        <input type="text" id="estimated-hours" placeholder="z.B. 2 oder 1.5">
                    </div>

                    <div class="form-group">
                        <label>Dienstleistung / Anfrage:</label>
                        <input type="text" id="service-search-input" placeholder="z.B. Baumpflege, Schnitt...">
                    </div>

                    <button type="submit" id="save-btn" class="btn-save" style="opacity: 0.6;" disabled>
                        Termin bestätigen & speichern
                    </button>
                </div>
                <input type="hidden" id="selected-appointment-date" required>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabaseClient.js';

        let activeClient = null;
        let allClients = [];
        let allAppointments = [];
        let allEmployees = [];
        const todayStrSystem = new Date().toISOString().split('T')[0];

        const searchInput = document.getElementById('client-search-input');
        const dropdown = document.getElementById('client-results-dropdown');
        const freeDateInput = document.getElementById('free-date-input');

        if (freeDateInput) freeDateInput.setAttribute('min', todayStrSystem);

        // Algoritmo de distancia vial
        async function fetchDrivingDistanceKm(lat1, lon1, lat2, lon2) {
            const apiKey = 'AIzaSyC4uaDGEnYaYHBqxhcCGyKA2uTAyJmwRZQ';
            const requestBody = {
                origin: { location: { latLng: { latitude: Number(lat1), longitude: Number(lon1) } } },
                destination: { location: { latLng: { latitude: Number(lat2), longitude: Number(lon2) } } },
                travelMode: "DRIVE"
            };

            try {
                const response = await fetch(`https://routes.googleapis.com/directions/v2:computeRoutes`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Goog-Api-Key': apiKey,
                        'X-Goog-FieldMask': 'routes.distanceMeters'
                    },
                    body: JSON.stringify(requestBody)
                });
                const data = await response.json();
                if (data.routes && data.routes.length > 0) {
                    return (data.routes[0].distanceMeters || 0) / 1000;
                }
            } catch (err) {
                console.error("Fehler bei der Entfernungsberechnung:", err);
            }
            // Haversine fallback
            const R = 6371;
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 1.3;
        }

        async function initForm() {
            try {
                const [{ data: clientData }, { data: apptData }, { data: employeeData }] = await Promise.all([
                    supabase.from('clients').select('*').order('name', { ascending: true }),
                    supabase.from('appointments').select('*'),
                    supabase.from('employees').select('*').order('name', { ascending: true })
                ]);

                allClients = clientData || [];
                allAppointments = apptData || [];
                allEmployees = employeeData || [];

                const empSelect = document.getElementById('employee-select');
                empSelect.innerHTML = `<option value="General">Nicht zugewiesen</option>`;
                allEmployees.forEach(emp => {
                    empSelect.innerHTML += `<option value="${emp.name}">${emp.name}</option>`;
                });
            } catch (err) {
                console.error('Fehler beim Initialisieren:', err);
            }
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) { dropdown.style.display = 'none'; return; }

            const filtered = allClients.filter(c => 
                (c.name || '').toLowerCase().includes(query) || 
                (c.address || '').toLowerCase().includes(query)
            );

            dropdown.innerHTML = '';
            if (filtered.length > 0) {
                filtered.forEach(client => {
                    const item = document.createElement('div');
                    item.className = 'client-result-item';
                    item.innerHTML = `<strong>${client.name}</strong><br><span style="color:#64748b;">${client.address || 'Keine Adresse'}</span>`;
                    item.addEventListener('click', () => {
                        selectClient(client);
                        dropdown.style.display = 'none';
                    });
                    dropdown.appendChild(item);
                });
                dropdown.style.display = 'block';
            }
        });

        async function selectClient(client) {
            activeClient = client;
            searchInput.value = `${client.name} - ${client.address || ''}`;
            document.getElementById('client-select').value = client.id;

            document.getElementById('det-name').textContent = client.name;
            document.getElementById('det-address').textContent = client.address || 'Keine Adresse';
            document.getElementById('det-coords').textContent = `${client.latitude || 'N/A'}, ${client.longitude || 'N/A'}`;
            document.getElementById('client-details').style.display = 'block';
            document.getElementById('date-section').style.display = 'block';

            const suggestionsList = document.getElementById('suggestions-list');
            suggestionsList.innerHTML = 'Entfernungen werden berechnet...';

            if (!client.latitude || !client.longitude) {
                suggestionsList.innerHTML = '<span style="color:#dc2626;">Dieser Kunde hat keine GPS-Koordinaten.</span>';
                return;
            }

            // Agrupar fechas de citas activas
            const activeDates = [...new Set(allAppointments.map(a => a.scheduled_date?.split('T')[0]))].filter(d => d >= todayStrSystem);

            if (activeDates.length > 0) {
                suggestionsList.innerHTML = '';
                for (const dateStr of activeDates) {
                    const apptsOnDate = allAppointments.filter(a => a.scheduled_date?.startsWith(dateStr));
                    let detailsHtml = '';

                    for (const appt of apptsOnDate) {
                        const otherClient = allClients.find(c => c.id === appt.client_id);
                        if (otherClient && otherClient.latitude && otherClient.longitude) {
                            const dist = await fetchDrivingDistanceKm(client.latitude, client.longitude, otherClient.latitude, otherClient.longitude);
                            const distFormatted = dist < 1 ? `${Math.round(dist * 1000)} m` : `${dist.toFixed(1)} km`;
                            detailsHtml += `<div style="font-size:0.75rem; color:#475569; margin-top:2px;">• <strong>${otherClient.name}</strong> um ${appt.time_slot || '09:00'} Uhr <span style="color:#0284c7; font-weight:bold;">(Entfernung: ${distFormatted})</span></div>`;
                        }
                    }

                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'suggestion-item-btn';
                    btn.innerHTML = `
                        <strong style="color:#0284c7;">📅 ${dateStr}</strong> (${apptsOnDate.length} Termin/e)
                        <div>${detailsHtml}</div>
                    `;

                    btn.addEventListener('click', () => {
                        document.getElementById('free-date-input').value = dateStr;
                        document.getElementById('selected-appointment-date').value = dateStr;
                        document.getElementById('appointment-time').value = '09:00';
                        
                        const saveBtn = document.getElementById('save-btn');
                        saveBtn.disabled = false;
                        saveBtn.style.opacity = '1';
                    });

                    suggestionsList.appendChild(btn);
                }
            } else {
                suggestionsList.innerHTML = '<span style="color:#64748b;">Keine vorhandenen Termine zur Optimierung gefunden.</span>';
            }
        }

        document.getElementById('appointment-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                client_id: document.getElementById('client-select').value,
                scheduled_date: document.getElementById('free-date-input').value,
                time_slot: document.getElementById('appointment-time').value || '09:00',
                estimated_hours: document.getElementById('estimated-hours').value || null,
                service_requested: document.getElementById('service-search-input').value || null,
                assigned_employee: document.getElementById('employee-select').value !== 'General' ? document.getElementById('employee-select').value : null
            };

            const { error } = await supabase.from('appointments').insert([payload]);

            if (error) {
                alert('Fehler beim Speichern: ' + error.message);
            } else {
                alert('Termin erfolgreich gespeichert!');
                location.reload();
            }
        });

        window.addEventListener('DOMContentLoaded', initForm);
    </script>
</body>
</html>
