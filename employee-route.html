<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClientSync | Mapa de Ruta del Día</title>
    <link rel="stylesheet" href="./css/main.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f1f5f9; 
            margin: 0; 
            padding: 8px; 
        }
        .container { 
            max-width: 100%; 
            margin: 0 auto; 
            background: white; 
            padding: 12px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            border: 1px solid #e2e8f0;
        }
        
        .controls-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #cbd5e0;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .controls-bar select, .controls-bar input {
            font-size: 13px;
            padding: 6px 8px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            background: white;
            outline: none;
            color: #1e293b;
            font-weight: 600;
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            height: 420px;
            border-radius: 10px;
            border: 1px solid #cbd5e0;
            overflow: hidden;
        }

        #daily-map {
            width: 100%;
            height: 100%;
        }

        /* Panel flotante compacto y claro en la esquina superior izquierda */
        #route-info-panel {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            background: #ffffff;
            color: #1e293b;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            width: 250px;
            display: none;
            border: 1px solid #cbd5e0;
        }

        /* SVG Overlay para la línea conectora precisa */
        #route-svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabecera -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h1 style="margin: 0; font-size: 1rem; color: #1e293b; font-weight: 800;">🗺️ Ruta del Día</h1>
            <a href="./admin-assignments.html" style="padding: 4px 8px; background: #e2e8f0; color: #475569; text-decoration: none; border-radius: 6px; font-size: 0.72rem; font-weight: 600;">← Volver</a>
        </div>

        <!-- Barra de Controles compacta -->
        <div class="controls-bar">
            <div style="flex: 1;">
                <label style="display: block; font-size: 0.65rem; color: #64748b; font-weight: 700; margin-bottom: 2px;">📅 Fecha:</label>
                <input type="date" id="route-date-input" style="width: 100%;">
            </div>
            <div style="flex: 1;">
                <label style="display: block; font-size: 0.65rem; color: #64748b; font-weight: 700; margin-bottom: 2px;">👷‍♂️ Empleado:</label>
                <select id="employee-filter" style="width: 100%;">
                    <option value="ALL">-- Todos --</option>
                </select>
            </div>
        </div>

        <!-- Contenedor del Mapa Interactivo con Panel y Línea SVG -->
        <div class="map-wrapper">
            <div id="daily-map"></div>
            
            <svg id="route-svg-overlay">
                <defs>
                    <marker id="arrow-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
                    </marker>
                </defs>
                <line id="connector-line" x1="0" y1="0" x2="0" y2="0" stroke="#1e293b" stroke-width="2.5" stroke-dasharray="3" marker-end="url(#arrow-dark)" />
            </svg>

            <div id="route-info-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; margin-bottom: 8px;">
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span id="segment-color-dot" style="width: 10px; height: 10px; border-radius: 50%; display: inline-block;"></span>
                        <strong style="color: #0284c7; font-size: 0.78rem; font-weight: 700;">Detalle del Trayecto</strong>
                    </div>
                    <button type="button" id="close-panel-btn" style="background: transparent; border: none; color: #64748b; font-size: 0.85rem; cursor: pointer; font-weight: bold; padding: 0 4px;">✕</button>
                </div>
                <div id="panel-content-body" style="font-size: 0.72rem; color: #334155; line-height: 1.4;"></div>
            </div>
        </div>
    </div>

    <!-- Google Maps JS API con librería geometry -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC4uaDGEnYaYHBqxhcCGyKA2uTAyJmwRZQ&libraries=geometry" async defer></script>

    <script type="module">
        import { supabase } from './js/supabaseClient.js';

        let map = null;
        let markers = [];
        let polylines = [];
        let infoWindow = null;
        let mapOverlay = null;
        
        let allClients = [];
        let allAppointments = [];
        let allEmployees = [];
        let activeRouteSegment = null;

        const todayStrSystem = new Date().toISOString().split('T')[0];

        const dateInput = document.getElementById('route-date-input');
        const employeeFilter = document.getElementById('employee-filter');
        const infoPanel = document.getElementById('route-info-panel');
        const panelBody = document.getElementById('panel-content-body');
        const closePanelBtn = document.getElementById('close-panel-btn');
        const segmentColorDot = document.getElementById('segment-color-dot');
        const connectorLine = document.getElementById('connector-line');

        const urlParams = new URLSearchParams(window.location.search);
        const preselectedEmployee = urlParams.get('employee');
        const preselectedDate = urlParams.get('date');

        dateInput.value = preselectedDate || todayStrSystem;

        const routeColors = ['#2563eb', '#16a34a', '#d97706', '#9333ea', '#dc2626', '#0891b2', '#db2777'];

        async function initEmployeeRouteMap() {
            try {
                const [{ data: clients }, { data: appointments }, { data: employees }] = await Promise.all([
                    supabase.from('clients').select('*').order('name', { ascending: true }),
                    supabase.from('appointments').select('*').order('time_slot', { ascending: true }),
                    supabase.from('employees').select('*').order('name', { ascending: true })
                ]);

                allClients = clients || [];
                allAppointments = appointments || [];
                allEmployees = employees || [];

                allEmployees.forEach(emp => {
                    employeeFilter.innerHTML += `<option value="${emp.name}">${emp.name}</option>`;
                });

                if (preselectedEmployee) {
                    const matchedEmp = allEmployees.find(e => e.name.toLowerCase() === preselectedEmployee.toLowerCase());
                    if (matchedEmp) {
                        employeeFilter.value = matchedEmp.name;
                    } else {
                        employeeFilter.value = preselectedEmployee;
                    }
                }

                initMapObject();
                renderSelectedDayData();

            } catch (err) {
                console.error('Error al inicializar mapa de ruta:', err);
            }
        }

        function initMapObject() {
            const centerOttobrunn = { lat: 48.0664, lng: 11.6611 };
            
            map = new google.maps.Map(document.getElementById('daily-map'), {
                zoom: 13,
                center: centerOttobrunn,
                gestureHandling: 'greedy',
                mapTypeControl: false,
                streetViewControl: false
            });

            mapOverlay = new google.maps.OverlayView();
            mapOverlay.onAdd = function() {};
            mapOverlay.draw = function() {};
            mapOverlay.onRemove = function() {};
            mapOverlay.setMap(map);

            infoWindow = new google.maps.InfoWindow({ maxWidth: 200 });

            map.addListener('click', () => {
                if (infoWindow) infoWindow.close();
                hideRouteInfoPanel();
            });

            map.addListener('bounds_changed', updateConnectorLinePosition);
            map.addListener('center_changed', updateConnectorLinePosition);
            map.addListener('zoom_changed', updateConnectorLinePosition);

            closePanelBtn.addEventListener('click', () => {
                hideRouteInfoPanel();
            });
        }

        function hideRouteInfoPanel() {
            infoPanel.style.display = 'none';
            connectorLine.style.display = 'none';
            activeRouteSegment = null;
        }

        function updateConnectorLinePosition() {
            if (!activeRouteSegment || !map || infoPanel.style.display === 'none') return;

            const proj = mapOverlay.getProjection();
            if (!proj) return;

            const mapDiv = document.getElementById('daily-map');
            const mapRect = mapDiv.getBoundingClientRect();
            const panelRect = infoPanel.getBoundingClientRect();

            const latLng = activeRouteSegment.midPoint;
            const divPixel = proj.fromLatLngToContainerPixel(latLng);

            if (divPixel) {
                const x1 = panelRect.left - mapRect.left + (panelRect.width / 2);
                const y1 = panelRect.bottom - mapRect.top;

                const x2 = divPixel.x;
                const y2 = divPixel.y;

                const dx = x2 - x1;
                const dy = y2 - y1;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                let targetX = x2;
                let targetY = y2;
                if (dist > 10) {
                    const offsetBack = 8;
                    targetX = x2 - (dx / dist) * offsetBack;
                    targetY = y2 - (dy / dist) * offsetBack;
                }

                connectorLine.setAttribute('x1', x1);
                connectorLine.setAttribute('y1', y1);
                connectorLine.setAttribute('x2', targetX);
                connectorLine.setAttribute('y2', targetY);
                connectorLine.style.display = 'block';
            }
        }

        function setupInfoWindowStyles() {
            google.maps.event.addListenerOnce(infoWindow, 'domready', () => {
                const iwContainer = document.querySelector('.gm-style-iw-c');
                if (iwContainer) {
                    iwContainer.style.background = '#ffffff';
                    iwContainer.style.padding = '4px';
                    iwContainer.style.borderRadius = '8px';
                    iwContainer.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
                }
                const iwOuter = document.querySelector('.gm-style-iw-d');
                if (iwOuter) {
                    iwOuter.style.overflow = 'hidden';
                    iwOuter.style.padding = '0';
                    iwOuter.style.maxHeight = 'none';
                }
                const closeBtn = document.querySelector('.gm-ui-hover-effect');
                if (closeBtn) closeBtn.style.display = 'none';
            });
        }

        function clearPreviousRoutes() {
            polylines.forEach(poly => poly.setMap(null));
            polylines = [];
            hideRouteInfoPanel();
        }

        async function renderSelectedDayData() {
            if (!map) return;

            const selectedDate = dateInput.value;
            const selectedEmployeeName = employeeFilter.value;
            const clientsMap = new Map(allClients.map(c => [c.id, c]));
            const employeesMap = new Map(allEmployees.map(e => [e.id, e.name]));

            const dayAppointments = allAppointments.filter(appt => {
                if (!appt.scheduled_date) return false;
                const apptDateOnly = appt.scheduled_date.includes('T') ? appt.scheduled_date.split('T')[0] : appt.scheduled_date;
                if (apptDateOnly !== selectedDate) return false;

                if (selectedEmployeeName === 'ALL') {
                    return clientsMap.has(appt.client_id);
                }

                let assignedEmpName = '';
                if (appt.employee_id) {
                    assignedEmpName = employeesMap.get(appt.employee_id) || '';
                }
                if (!assignedEmpName && appt.assigned_employee) {
                    assignedEmpName = appt.assigned_employee;
                }

                if (!assignedEmpName || assignedEmpName.toLowerCase() !== selectedEmployeeName.toLowerCase()) {
                    return false;
                }

                return clientsMap.has(appt.client_id);
            });

            markers.forEach(m => m.setMap(null));
            markers = [];
            clearPreviousRoutes();

            if (dayAppointments.length === 0) {
                alert('No hay citas programadas para esta fecha y empleado.');
                map.setCenter({ lat: 48.0664, lng: 11.6611 });
                map.setZoom(13);
                return;
            }

            const validStops = [];
            dayAppointments.forEach(appt => {
                const client = clientsMap.get(appt.client_id);
                if (client && client.latitude && client.longitude) {
                    validStops.push({
                        client,
                        appt,
                        latLng: new google.maps.LatLng(Number(client.latitude), Number(client.longitude))
                    });
                }
            });

            if (validStops.length === 0) {
                alert('Las citas de este día no tienen coordenadas geográficas válidas registradas.');
                return;
            }

            validStops.sort((a, b) => {
                const timeA = a.appt.time_slot || '00:00';
                const timeB = b.appt.time_slot || '00:00';
                return timeA.localeCompare(timeB);
            });

            const bounds = new google.maps.LatLngBounds();

            validStops.forEach((stop, index) => {
                bounds.extend(stop.latLng);

                const marker = new google.maps.Marker({
                    position: stop.latLng,
                    map: map,
                    label: {
                        text: String(index + 1),
                        color: "white",
                        fontWeight: "bold"
                    },
                    title: `Parada #${index + 1}: ${stop.client.name}`
                });

                const clientPhone = stop.client.phone || 'No registrado';
                
                const windowContent = `
                    <div style="font-family: -apple-system, sans-serif; background: #ffffff; color: #1e293b; padding: 6px; border-radius: 6px; width: 170px;">
                        <div style="border-bottom: 1px solid #e2e8f0; padding-bottom: 2px; margin-bottom: 3px; text-align: center;">
                            <strong style="color: #0284c7; font-size: 0.72rem;">#${index + 1} - ⏰ ${stop.appt.time_slot || '09:00'}h</strong>
                        </div>
                        <h4 style="margin: 0 0 1px 0; font-size: 0.72rem; color: #0f172a;">${stop.client.name}</h4>
                        <p style="margin: 0 0 2px 0; font-size: 0.62rem; color: #64748b;">📍 ${stop.client.address || 'Sin dirección'}</p>
                        <p style="margin: 0; font-size: 0.62rem; color: #64748b;">📞 ${clientPhone}</p>
                    </div>
                `;

                marker.addListener('click', (e) => {
                    e.stop();
                    hideRouteInfoPanel();
                    infoWindow.setContent(windowContent);
                    infoWindow.open(map, marker);
                    setupInfoWindowStyles();
                });

                markers.push(marker);
            });

            map.fitBounds(bounds);

            const apiKey = 'AIzaSyC4uaDGEnYaYHBqxhcCGyKA2uTAyJmwRZQ';

            for (let i = 0; i < validStops.length - 1; i++) {
                const originStop = validStops[i];
                const destStop = validStops[i + 1];

                const origin = originStop.latLng;
                const destination = destStop.latLng;
                const segmentColor = routeColors[i % routeColors.length];

                const requestBody = {
                    origin: { location: { latLng: { latitude: origin.lat(), longitude: origin.lng() } } },
                    destination: { location: { latLng: { latitude: destination.lat(), longitude: destination.lng() } } },
                    travelMode: "DRIVE",
                    routingPreference: "TRAFFIC_AWARE"
                };

                try {
                    const response = await fetch(`https://routes.googleapis.com/directions/v2:computeRoutes`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Goog-Api-Key': apiKey,
                            'X-Goog-FieldMask': 'routes.polyline.encodedPolyline,routes.distanceMeters,routes.duration'
                        },
                        body: JSON.stringify(requestBody)
                    });

                    const data = await response.json();

                    if (data.routes && data.routes.length > 0) {
                        const route = data.routes[0];
                        const encodedPolyline = route.polyline.encodedPolyline;
                        const distanceMeters = route.distanceMeters || 0;
                        const durationSecs = route.duration ? parseInt(route.duration) : 0;

                        const distanceText = distanceMeters >= 1000 
                            ? `${(distanceMeters / 1000).toFixed(1)} km` 
                            : `${distanceMeters} m`;

                        const durationMins = Math.round(durationSecs / 60);
                        const durationText = durationMins >= 60 
                            ? `${Math.floor(durationMins / 60)}h ${durationMins % 60}min` 
                            : `${durationMins} min`;

                        const decodedPath = google.maps.geometry.encoding.decodePath(encodedPolyline);

                        const routePath = new google.maps.Polyline({
                            path: decodedPath,
                            geodesic: true,
                            strokeColor: segmentColor,
                            strokeOpacity: 0.9,
                            strokeWeight: 6,
                            map: map
                        });

                        const midIndex = Math.floor(decodedPath.length / 2);
                        const midPoint = decodedPath[midIndex];

                        // Enlace oficial de navegación de Google Maps
                        const mapsNavUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin.lat()},${origin.lng()}&destination=${destination.lat()},${destination.lng()}&travelmode=driving`;

                        routePath.addListener('click', () => {
                            if (infoWindow) infoWindow.close();

                            segmentColorDot.style.background = segmentColor;
                            panelBody.innerHTML = `
                                <div style="margin-bottom: 4px;">
                                    <span style="color: #0284c7; font-weight: 700;">Desde (#${i+1}):</span> <strong>${originStop.client.name}</strong><br>
                                    <span style="color: #64748b; font-size: 0.65rem; padding-left: 10px;">${originStop.client.address || 'Sin dirección'}</span>
                                </div>
                                <div style="margin-bottom: 6px;">
                                    <span style="color: #dc2626; font-weight: 700;">Hasta (#${i+2}):</span> <strong>${destStop.client.name}</strong><br>
                                    <span style="color: #64748b; font-size: 0.65rem; padding-left: 10px;">${destStop.client.address || 'Sin dirección'}</span>
                                </div>
                                <div style="border-top: 1px solid #e2e8f0; padding-top: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem;">
                                    <span style="color: #475569;">📏 <strong>${distanceText}</strong></span>
                                    <span style="color: #475569; text-align: center;">⏱️ <strong>${durationText}</strong></span>
                                    <a href="${mapsNavUrl}" target="_blank" style="background: #2563eb; color: white; padding: 3px 8px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 0.68rem; display: inline-flex; align-items: center; gap: 2px;">🧭 Navegar</a>
                                </div>
                            `;

                            activeRouteSegment = { midPoint };
                            infoPanel.style.display = 'block';
                            
                            requestAnimationFrame(() => {
                                updateConnectorLinePosition();
                            });
                        });

                        polylines.push(routePath);
                    }
                } catch (error) {
                    console.error(`Error al conectar tramo ${i+1} -> ${i+2}:`, error);
                }
            }
        }

        dateInput.value = preselectedDate || todayStrSystem;
        dateInput.addEventListener('change', renderSelectedDayData);
        employeeFilter.addEventListener('change', renderSelectedDayData);

        if (window.google && window.google.maps) {
            initEmployeeRouteMap();
        } else {
            window.addEventListener('load', initEmployeeRouteMap);
        }
    </script>
</body>
</html>
