<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClientSync | Mapa de Ruta por Fecha</title>
    <link rel="stylesheet" href="./css/main.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f1f5f9; 
            margin: 0; 
            padding: 12px; 
        }
        .container { 
            max-width: 650px; 
            margin: 10px auto 60px auto; 
            background: white; 
            padding: 18px; 
            border-radius: 16px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.06); 
            border: 1px solid #e2e8f0;
        }
        
        .controls-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #cbd5e0;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .controls-bar select, .controls-bar input {
            font-size: 14px;
            padding: 8px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            background: white;
            outline: none;
            color: #1e293b;
            font-weight: 600;
        }

        #daily-map {
            width: 100%;
            height: 380px;
            border-radius: 12px;
            border: 1px solid #cbd5e0;
            margin-bottom: 16px;
        }

        .client-card { 
            background: #ffffff; 
            border: 1px solid #e2e8f0;
            border-left: 5px solid #2563eb; 
            padding: 14px; 
            border-radius: 12px; 
            margin-bottom: 10px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.03); 
        }

        .btn-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #2563eb;
            color: white;
            border: none;
            padding: 9px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            margin-top: 8px;
            width: 100%;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
            transition: background 0.2s;
        }
        .btn-nav:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabecera -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
            <h1 style="margin: 0; font-size: 1.2rem; color: #1e293b; font-weight: 800;">🗺️ Mapa de Ruta del Día</h1>
            <a href="./employee-schedule.html" style="padding: 6px 10px; background: #e2e8f0; color: #475569; text-decoration: none; border-radius: 8px; font-size: 0.78rem; font-weight: 600;">← Volver al Portal</a>
        </div>

        <!-- Barra de Controles: Selector de Fecha y Filtro de Empleado -->
        <div class="controls-bar">
            <div style="flex: 1; min-width: 140px;">
                <label style="display: block; font-size: 0.72rem; color: #64748b; font-weight: 700; margin-bottom: 3px;">📅 Fecha Seleccionada:</label>
                <input type="date" id="route-date-input" style="width: 100%;">
            </div>
            <div style="flex: 1; min-width: 140px;">
                <label style="display: block; font-size: 0.72rem; color: #64748b; font-weight: 700; margin-bottom: 3px;">👷‍♂️ Empleado:</label>
                <select id="employee-filter" style="width: 100%;">
                    <option value="ALL">-- Todos --</option>
                </select>
            </div>
        </div>

        <!-- Contenedor del Mapa Interactivo -->
        <div id="daily-map"></div>

        <!-- Lista de tareas / clientes correspondientes a ese día -->
        <div id="daily-schedule-list">
            <p style="color: #94a3b8; text-align: center; font-size: 0.85rem;">Cargando citas del día...</p>
        </div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC4uaDGEnYaYHBqxhcCGyKA2uTAyJmwRZQ" async defer></script>

    <script type="module">
        import { supabase } from './js/supabaseClient.js';

        let map = null;
        let markers = [];
        let infoWindow = null;
        let allClients = [];
        let allAppointments = [];
        let allEmployees = [];

        const todayStrSystem = new Date().toISOString().split('T')[0];

        const dateInput = document.getElementById('route-date-input');
        const employeeFilter = document.getElementById('employee-filter');

        // Capturar parámetros de la URL enviados desde el menú
        const urlParams = new URLSearchParams(window.location.search);
        const preselectedEmployee = urlParams.get('employee');
        const preselectedDate = urlParams.get('date');

        dateInput.value = preselectedDate || todayStrSystem;

        function formatDateToDDMMYYYY(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;
        }

        async function initEmployeeRouteMap() {
            try {
                const [{ data: clients }, { data: appointments }, { data: employees }] = await Promise.all([
                    supabase.from('clients').select('*').order('name', { ascending: true }),
                    supabase.from('appointments').select('*').order('time_slot', { ascending: true }),
                    supabase.from('employees').select('*').order('name', { ascending: true })
                ]);

                allClients = clients || [];
                allAppointments = appointments || [];
                allEmployees = employees || [];

                allEmployees.forEach(emp => {
                    employeeFilter.innerHTML += `<option value="${emp.name}">${emp.name}</option>`;
                });

                if (preselectedEmployee) {
                    employeeFilter.value = preselectedEmployee;
                }

                initMapObject();
                renderSelectedDayData();

            } catch (err) {
                console.error('Error al inicializar mapa de ruta:', err);
            }
        }

        function initMapObject() {
            const centerOttobrunn = { lat: 48.0664, lng: 11.6611 };
            map = new google.maps.Map(document.getElementById('daily-map'), {
                zoom: 13,
                center: centerOttobrunn,
                mapTypeControl: false,
                streetViewControl: false
            });

            infoWindow = new google.maps.InfoWindow({ maxWidth: 220 });
        }

        function renderSelectedDayData() {
            if (!map) return;

            const selectedDate = dateInput.value;
            const selectedEmployee = employeeFilter.value;
            const clientsMap = new Map(allClients.map(c => [c.id, c]));

            const dayAppointments = allAppointments.filter(appt => {
                if (!appt.scheduled_date || appt.scheduled_date.split('T')[0] !== selectedDate) return false;
                if (selectedEmployee !== 'ALL' && appt.assigned_employee !== selectedEmployee) return false;
                return clientsMap.has(appt.client_id);
            });

            markers.forEach(m => m.setMap(null));
            markers = [];

            const listContainer = document.getElementById('daily-schedule-list');

            if (dayAppointments.length === 0) {
                listContainer.innerHTML = `
                    <div style="background: #fffbeb; border: 1px solid #fef3c7; padding: 16px; border-radius: 10px; text-align: center; color: #b45309;">
                        <strong>No hay citas programadas para el ${formatDateToDDMMYYYY(selectedDate)}.</strong>
                    </div>
                `;
                map.setCenter({ lat: 48.0664, lng: 11.6611 });
                map.setZoom(13);
                return;
            }

            const bounds = new google.maps.LatLngBounds();
            let listHtml = `<h3 style="font-size: 0.95rem; color: #1e293b; margin-bottom: 10px;">📅 Ruta del ${formatDateToDDMMYYYY(selectedDate)} (${dayAppointments.length} paradas):</h3>`;

            dayAppointments.forEach((appt, index) => {
                const client = clientsMap.get(appt.client_id);
                if (!client || !client.latitude || !client.longitude) return;

                const pos = { lat: Number(client.latitude), lng: Number(client.longitude) };
                bounds.extend(pos);

                // Pin con número secuencial (1, 2, 3, 4...)
                const marker = new google.maps.Marker({
                    position: pos,
                    map: map,
                    label: {
                        text: String(index + 1),
                        color: "white",
                        fontWeight: "bold"
                    },
                    title: `${index + 1}. ${client.name} (${appt.time_slot || '09:00'})`
                });

                const clientPhone = client.phone || client.telefono || '';
                const phoneHtml = clientPhone ? `<br>📞 Tel: ${clientPhone}` : '';
                const techAssigned = appt.assigned_employee ? `<br>👷‍♂️ Técnico: <strong>${appt.assigned_employee}</strong>` : '';

                const windowContent = `
                    <div style="font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 6px; border-radius: 6px;">
                        <strong style="color: #38bdf8; font-size: 0.8rem;">#${index + 1}: ${client.name}</strong><br>
                        <span style="font-size: 0.72rem;">⏰ Hora: ${appt.time_slot || '09:00'}h</span><br>
                        <span style="font-size: 0.72rem;">📍 ${client.address || 'Sin dirección'}</span>
                        ${techAssigned}
                        ${phoneHtml}
                    </div>
                `;

                marker.addListener('click', () => {
                    infoWindow.setContent(windowContent);
                    infoWindow.open(map, marker);
                });

                markers.push(marker);

                const mapsQuery = `${client.latitude},${client.longitude}`;
                const mapsNavUrl = `https://www.google.com/maps/dir/?api=1&destination=${mapsQuery}&travelmode=driving`;
                const serviceStr = appt.service_requested ? `<span style="color: #2563eb; font-weight: 700;">🛠️ ${appt.service_requested}</span><br>` : '';

                listHtml += `
                    <div class="client-card">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <strong style="font-size: 0.95rem; color: #1e293b;">Parada #${index + 1} - ⏰ ${appt.time_slot || '09:00'}h</strong>
                            <span style="font-size: 0.72rem; background: #e2e8f0; padding: 2px 6px; border-radius: 6px; font-weight: 700; color: #475569;">${appt.assigned_employee || 'Sin asignar'}</span>
                        </div>
                        <h4 style="margin: 6px 0 2px 0; font-size: 0.95rem; color: #0f172a;">${client.name}</h4>
                        <p style="margin: 0 0 3px 0; font-size: 0.82rem; color: #475569;">📍 ${client.address || 'Sin dirección'}</p>
                        <p style="margin: 0 0 6px 0; font-size: 0.82rem;">${serviceStr}</p>
                        <a href="${mapsNavUrl}" target="_blank" class="btn-nav">🧭 Iniciar Navegación GPS (Parada #${index + 1})</a>
                    </div>
                `;
            });

            listContainer.innerHTML = listHtml;

            if (dayAppointments.length > 0) {
                map.fitBounds(bounds);
            }
        }

        dateInput.addEventListener('change', renderSelectedDayData);
        employeeFilter.addEventListener('change', renderSelectedDayData);

        initEmployeeRouteMap();
    </script>
</body>
</html>
