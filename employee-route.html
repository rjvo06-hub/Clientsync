<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClientSync | Mapa de Ruta del Día</title>
    <link rel="stylesheet" href="./css/main.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f1f5f9; 
            margin: 0; 
            padding: 12px; 
        }
        .container { 
            max-width: 650px; 
            margin: 10px auto 60px auto; 
            background: white; 
            padding: 18px; 
            border-radius: 16px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.06); 
            border: 1px solid #e2e8f0;
        }
        
        .controls-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #cbd5e0;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .controls-bar select, .controls-bar input {
            font-size: 14px;
            padding: 8px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            background: white;
            outline: none;
            color: #1e293b;
            font-weight: 600;
        }

        #daily-map {
            width: 100%;
            height: 500px;
            border-radius: 12px;
            border: 1px solid #cbd5e0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabecera -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
            <h1 style="margin: 0; font-size: 1.2rem; color: #1e293b; font-weight: 800;">🗺️ Mapa de Ruta del Día</h1>
            <a href="./employee-schedule.html" style="padding: 6px 10px; background: #e2e8f0; color: #475569; text-decoration: none; border-radius: 8px; font-size: 0.78rem; font-weight: 600;">← Volver al Portal</a>
        </div>

        <!-- Barra de Controles: Selector de Fecha y Filtro de Empleado -->
        <div class="controls-bar">
            <div style="flex: 1; min-width: 140px;">
                <label style="display: block; font-size: 0.72rem; color: #64748b; font-weight: 700; margin-bottom: 3px;">📅 Fecha Seleccionada:</label>
                <input type="date" id="route-date-input" style="width: 100%;">
            </div>
            <div style="flex: 1; min-width: 140px;">
                <label style="display: block; font-size: 0.72rem; color: #64748b; font-weight: 700; margin-bottom: 3px;">👷‍♂️ Empleado:</label>
                <select id="employee-filter" style="width: 100%;">
                    <option value="ALL">-- Todos --</option>
                </select>
            </div>
        </div>

        <!-- Contenedor del Mapa Interactivo -->
        <div id="daily-map"></div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC4uaDGEnYaYHBqxhcCGyKA2uTAyJmwRZQ" async defer></script>

    <script type="module">
        import { supabase } from './js/supabaseClient.js';

        let map = null;
        let markers = [];
        let routeRenderers = [];
        let infoWindow = null;
        let directionsService = null;
        
        let allClients = [];
        let allAppointments = [];
        let allEmployees = [];

        const todayStrSystem = new Date().toISOString().split('T')[0];

        const dateInput = document.getElementById('route-date-input');
        const employeeFilter = document.getElementById('employee-filter');

        const urlParams = new URLSearchParams(window.location.search);
        const preselectedEmployee = urlParams.get('employee');
        const preselectedDate = urlParams.get('date');

        dateInput.value = preselectedDate || todayStrSystem;

        // Paleta de colores distintivos para cada tramo de la ruta
        const routeColors = ['#2563eb', '#16a34a', '#d97706', '#9333ea', '#dc2626', '#0891b2', '#db2777'];

        async function initEmployeeRouteMap() {
            try {
                const [{ data: clients }, { data: appointments }, { data: employees }] = await Promise.all([
                    supabase.from('clients').select('*').order('name', { ascending: true }),
                    supabase.from('appointments').select('*').order('time_slot', { ascending: true }),
                    supabase.from('employees').select('*').order('name', { ascending: true })
                ]);

                allClients = clients || [];
                allAppointments = appointments || [];
                allEmployees = employees || [];

                allEmployees.forEach(emp => {
                    employeeFilter.innerHTML += `<option value="${emp.name}">${emp.name}</option>`;
                });

                if (preselectedEmployee) {
                    employeeFilter.value = preselectedEmployee;
                }

                initMapObject();
                renderSelectedDayData();

            } catch (err) {
                console.error('Error al inicializar mapa de ruta:', err);
            }
        }

        function initMapObject() {
            const centerOttobrunn = { lat: 48.0664, lng: 11.6611 };
            
            map = new google.maps.Map(document.getElementById('daily-map'), {
                zoom: 13,
                center: centerOttobrunn,
                gestureHandling: 'greedy',
                mapTypeControl: false,
                streetViewControl: false
            });

            infoWindow = new google.maps.InfoWindow({ maxWidth: 220 });
            directionsService = new google.maps.DirectionsService();

            map.addListener('click', () => {
                if (infoWindow) {
                    infoWindow.close();
                }
            });
        }

        function setupInfoWindowStyles() {
            google.maps.event.addListenerOnce(infoWindow, 'domready', () => {
                const iwContainer = document.querySelector('.gm-style-iw-c');
                if (iwContainer) {
                    iwContainer.style.background = '#0f172a';
                    iwContainer.style.padding = '2px 4px 4px 4px';
                    iwContainer.style.borderRadius = '8px';
                    iwContainer.style.boxShadow = '0 6px 15px rgba(0,0,0,0.4)';
                }
                const iwOuter = document.querySelector('.gm-style-iw-d');
                if (iwOuter) {
                    iwOuter.style.overflow = 'hidden';
                    iwOuter.style.padding = '0';
                    iwOuter.style.maxHeight = 'none';
                }
                const closeBtn = document.querySelector('.gm-ui-hover-effect');
                if (closeBtn) closeBtn.style.display = 'none';

                let styleTag = document.getElementById('custom-infowindow-dark-style-modal');
                if (!styleTag) {
                    styleTag = document.createElement('style');
                    styleTag.id = 'custom-infowindow-dark-style-modal';
                    styleTag.innerHTML = `
                        .gm-style-iw-t::after { background: #0f172a !important; box-shadow: none !important; }
                        .gm-style-iw-tc::after { background: #0f172a !important; }
                    `;
                    document.head.appendChild(styleTag);
                }
            });
        }

        function clearPreviousRoutes() {
            routeRenderers.forEach(renderer => renderer.setMap(null));
            routeRenderers = [];
        }

        function renderSelectedDayData() {
            if (!map) return;

            const selectedDate = dateInput.value;
            const selectedEmployee = employeeFilter.value;
            const clientsMap = new Map(allClients.map(c => [c.id, c]));

            const dayAppointments = allAppointments.filter(appt => {
                if (!appt.scheduled_date || appt.scheduled_date.split('T')[0] !== selectedDate) return false;
                if (selectedEmployee !== 'ALL' && appt.assigned_employee !== selectedEmployee) return false;
                return clientsMap.has(appt.client_id);
            });

            markers.forEach(m => m.setMap(null));
            markers = [];
            clearPreviousRoutes();

            if (dayAppointments.length === 0) {
                alert('No hay citas programadas para esta fecha y empleado.');
                map.setCenter({ lat: 48.0664, lng: 11.6611 });
                map.setZoom(13);
                return;
            }

            const validStops = [];
            dayAppointments.forEach(appt => {
                const client = clientsMap.get(appt.client_id);
                if (client && client.latitude && client.longitude) {
                    validStops.push({
                        client,
                        appt,
                        latLng: new google.maps.LatLng(Number(client.latitude), Number(client.longitude))
                    });
                }
            });

            if (validStops.length === 0) return;

            const bounds = new google.maps.LatLngBounds();

            // 1. Dibujar marcadores numerados
            validStops.forEach((stop, index) => {
                bounds.extend(stop.latLng);

                const marker = new google.maps.Marker({
                    position: stop.latLng,
                    map: map,
                    label: {
                        text: String(index + 1),
                        color: "white",
                        fontWeight: "bold"
                    },
                    title: `Parada #${index + 1}: ${stop.client.name}`
                });

                const clientPhone = stop.client.phone || stop.client.telefono || 'No registrado';
                const techAssigned = stop.appt.assigned_employee ? `<br>👷‍♂️ Técnico: <strong>${stop.appt.assigned_employee}</strong>` : '';
                const serviceStr = stop.appt.service_requested ? `<br>🛠️ Servicio: <strong>${stop.appt.service_requested}</strong>` : '';
                
                const windowContent = `
                    <div style="font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 6px; border-radius: 6px; width: 190px;">
                        <div style="border-bottom: 1px solid #1e293b; padding-bottom: 3px; margin-bottom: 4px; text-align: center;">
                            <strong style="color: #38bdf8; font-size: 0.78rem; font-weight: 700;">Parada #${index + 1} - ⏰ ${stop.appt.time_slot || '09:00'}h</strong>
                        </div>
                        <h4 style="margin: 0 0 2px 0; font-size: 0.78rem; color: #ffffff;">${stop.client.name}</h4>
                        <p style="margin: 0 0 3px 0; font-size: 0.65rem; color: #cbd5e1;">📍 ${stop.client.address || 'Sin dirección'}</p>
                        ${serviceStr ? `<span style="font-size: 0.65rem; color: #cbd5e1;">${serviceStr}</span>` : ''}
                        ${techAssigned ? `<span style="font-size: 0.65rem; color: #cbd5e1;">${techAssigned}</span>` : ''}
                        <p style="margin: 0 0 2px 0; font-size: 0.65rem; color: #cbd5e1;">📞 Tel: ${clientPhone}</p>
                    </div>
                `;

                marker.addListener('click', (e) => {
                    e.stop();
                    infoWindow.setContent(windowContent);
                    infoWindow.open(map, marker);
                    setupInfoWindowStyles();
                });

                markers.push(marker);
            });

            map.fitBounds(bounds);

            // 2. Dibujar cada tramo de la ruta de forma independiente con un color único
            for (let i = 0; i < validStops.length - 1; i++) {
                const origin = validStops[i].latLng;
                const destination = validStops[i + 1].latLng;
                const segmentColor = routeColors[i % routeColors.length];

                directionsService.route({
                    origin: origin,
                    destination: destination,
                    travelMode: google.maps.TravelMode.DRIVING
                }, (response, status) => {
                    if (status === 'OK') {
                        const renderer = new google.maps.DirectionsRenderer({
                            map: map,
                            suppressMarkers: true,
                            polylineOptions: {
                                strokeColor: segmentColor,
                                strokeWeight: 5,
                                strokeOpacity: 0.85
                            }
                        });
                        renderer.setDirections(response);
                        routeRenderers.push(renderer);
                    } else {
                        console.error(`Error al trazar tramo ${i + 1} -> ${i + 2}:`, status);
                    }
                });
            }
        }

        dateInput.addEventListener('change', renderSelectedDayData);
        employeeFilter.addEventListener('change', renderSelectedDayData);

        initEmployeeRouteMap();
    </script>
</body>
</html>
