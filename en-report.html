<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitarbeiter Arbeitszeitbericht</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2pdf.js für den HTML -> PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* CONTENEDOR PDF OPTIMIZADO PARA A4 */
        .pdf-page {
            width: 210mm;
            height: auto;
            padding: 0 8mm 8mm 8mm;
            background: white;
            margin: auto;
            box-sizing: border-box;
        }

        /* IMPRESIÓN DIRECTA DEL NAVEGADOR */
        @media print {
            @page {
                size: A4 portrait;
                margin: 28mm 8mm 12mm 8mm;
            }
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .pdf-page {
                width: 100%;
                padding: 0;
                box-shadow: none;
            }
        }

        thead { display: table-header-group; }
        tfoot { display: table-footer-group; }

        /* EVITA CORTAR REGISTROS DE EMPLEADOS A LA MITAD */
        .log-card {
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen py-6 px-4">

    <!-- CONTROLES Y FILTROS (NO-PRINT) -->
    <div class="no-print max-w-4xl mx-auto mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-3">
            <div>
                <h1 class="text-lg font-bold text-gray-800">Arbeitszeitbericht-Generator</h1>
                <p class="text-xs text-gray-500">Erfassung der täglichen Arbeitszeiten und Pausen</p>
            </div>
            
            <div class="flex gap-2">
                <button id="btnImprimir" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-800 text-white font-medium rounded-lg text-xs transition flex items-center gap-1.5">
                    🖨️ Drucken
                </button>
                <button id="btnDescargarPDF" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow-sm transition flex items-center gap-2 text-sm disabled:opacity-50" disabled>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    PDF herunterladen
                </button>
            </div>
        </div>

        <!-- FILTROS Y CONTROLES INTERACTIVOS -->
        <div class="pt-2 border-t border-gray-100 flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-1.5" id="grupoBotonesRapidos">
                <button data-rango="semana_actual" class="btn-rango px-2.5 py-1 text-xs font-semibold rounded-lg border bg-indigo-50 border-indigo-200 text-indigo-700">Diese Woche</button>
                <button data-rango="semana_pasada" class="btn-rango px-2.5 py-1 text-xs font-semibold rounded-lg border bg-white border-gray-200 text-gray-600 hover:bg-gray-50">Letzte Woche</button>
                <button data-rango="mes_actual" class="btn-rango px-2.5 py-1 text-xs font-semibold rounded-lg border bg-white border-gray-200 text-gray-600 hover:bg-gray-50">Diesen Monat</button>
                <button data-rango="todo" class="btn-rango px-2.5 py-1 text-xs font-semibold rounded-lg border bg-white border-gray-200 text-gray-600 hover:bg-gray-50">Alle anzeigen</button>
            </div>

            <div class="flex items-center gap-2">
                <!-- SELECTOR DE EMPLEADO -->
                <select id="selectEmpleado" class="px-2.5 py-1 text-xs border border-gray-300 rounded-lg bg-white text-gray-700 font-medium">
                    <option value="todos">Alle Mitarbeiter</option>
                </select>

                <label class="flex items-center gap-1.5 cursor-pointer text-xs font-medium text-gray-700 bg-gray-50 px-2.5 py-1 rounded border border-gray-200 hover:bg-gray-100 select-none">
                    <input type="checkbox" id="chkRangoManual" class="w-3.5 h-3.5 text-indigo-600 rounded border-gray-300">
                    Manuelle Auswahl
                </label>
            </div>
        </div>

        <!-- PANEL DE RANGO MANUAL DE FECHAS -->
        <div id="panelRangoManual" class="hidden mt-3 pt-2 border-t border-dashed border-gray-200 flex flex-wrap items-end gap-2 bg-indigo-50/50 p-2 rounded-lg">
            <div>
                <label class="block text-[11px] font-medium text-gray-600 mb-0.5">Von Datum</label>
                <input type="date" id="fechaDesde" class="px-2 py-1 text-xs border border-gray-300 rounded bg-white">
            </div>
            <div>
                <label class="block text-[11px] font-medium text-gray-600 mb-0.5">Bis Datum</label>
                <input type="date" id="fechaHasta" class="px-2 py-1 text-xs border border-gray-300 rounded bg-white">
            </div>
            <button id="btnAplicarManual" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium rounded shadow-sm">
                Abfragen
            </button>
        </div>
    </div>

    <!-- DOCUMENTO A IMPRIMIR / PDF -->
    <div class="overflow-x-auto pb-4">
        <div id="pdfContainer" class="pdf-page">
            
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-indigo-50/80 text-indigo-950 uppercase text-[10px] font-bold border-y border-indigo-200">
                        <th class="py-1.5 px-2 w-1/6">Datum</th>
                        <th class="py-1.5 px-2 w-1/4">Mitarbeiter</th>
                        <th class="py-1.5 px-2 text-center w-1/5">Arbeitszeit</th>
                        <th class="py-1.5 px-2 text-center w-1/6">Pause</th>
                        <th class="py-1.5 px-2 text-center w-1/6">Netto Std.</th>
                    </tr>
                </thead>

                <!-- CUERPO DE DATOS -->
                <tbody id="tablaCuerpo" class="divide-y divide-gray-200 text-xs">
                    <tr>
                        <td colspan="5" class="py-6 text-center text-gray-400 italic">
                            Daten werden geladen...
                        </td>
                    </tr>
                </tbody>

                <!-- PIE DE PÁGINA -->
                <tfoot>
                    <tr>
                        <td colspan="5" class="pt-2">
                            <div class="border-t border-gray-200 pt-2 flex justify-between items-center text-[10px] text-gray-400">
                                <p>Zeiterfassungssystem & Personalverwaltung</p>
                                <p>Automatisch generiertes Dokument</p>
                            </div>
                        </td>
                    </tr>
                </tfoot>
            </table>

        </div>
    </div>

    <!-- LOGICA SUPABASE Y FORMATO -->
    <script type="module">
        import { supabase } from './js/supabaseClient.js';

        const btnDescargarPDF = document.getElementById('btnDescargarPDF');
        const btnImprimir = document.getElementById('btnImprimir');
        const chkRangoManual = document.getElementById('chkRangoManual');
        const panelRangoManual = document.getElementById('panelRangoManual');
        const btnAplicarManual = document.getElementById('btnAplicarManual');
        const fechaDesde = document.getElementById('fechaDesde');
        const fechaHasta = document.getElementById('fechaHasta');
        const tablaCuerpo = document.getElementById('tablaCuerpo');
        const botonesRango = document.querySelectorAll('.btn-rango');
        const selectEmpleado = document.getElementById('selectEmpleado');

        let modoActual = 'semana_actual';
        let textoPeriodoPDF = "Arbeitszeiten der Mitarbeiter";
        let fechaEmisionPDF = new Date().toLocaleDateString('de-DE', {
            year: 'numeric', month: 'long', day: 'numeric'
        });

        // Cargar empleados dinámicamente de Supabase
        async function cargarListaEmpleados() {
            try {
                const { data } = await supabase.from('employees').select('name').order('name');
                if (data) {
                    data.forEach(emp => {
                        const opt = document.createElement('option');
                        opt.value = emp.name;
                        opt.textContent = emp.name;
                        selectEmpleado.appendChild(opt);
                    });
                }
            } catch (err) {
                console.warn('Fehler beim Laden der Mitarbeiterliste:', err);
            }
        }

        function obtenerFechasPorModo(modo) {
            const hoy = new Date();
            let inicio, fin;

            if (modo === 'semana_actual' || modo === 'semana_pasada') {
                const diaSemana = hoy.getDay();
                const diffLunes = hoy.getDate() - diaSemana + (diaSemana === 0 ? -6 : 1);
                
                const lunes = new Date(hoy.setDate(diffLunes));
                if (modo === 'semana_pasada') {
                    lunes.setDate(lunes.getDate() - 7);
                }
                
                const domingo = new Date(lunes);
                domingo.setDate(lunes.getDate() + 6);

                inicio = lunes.toISOString().slice(0,10);
                fin = domingo.toISOString().slice(0,10);
            } else if (modo === 'mes_actual') {
                const primerDia = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
                const ultimoDia = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0);

                inicio = primerDia.toISOString().slice(0,10);
                fin = ultimoDia.toISOString().slice(0,10);
            }

            return { inicio, fin };
        }

        function formatearHora(isoString) {
            if (!isoString) return '-';
            try {
                const date = new Date(isoString);
                if (isNaN(date.getTime())) return String(isoString).substring(0, 5);
                return date.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', hour12: false });
            } catch {
                return '-';
            }
        }

        function formatearFechaEspanolAAleman(fechaStr) {
            if (!fechaStr) return '-';
            const partes = fechaStr.split('-');
            if (partes.length === 3) {
                return `${partes[2]}.${partes[1]}.${partes[0]}`;
            }
            return fechaStr;
        }

        // CÁLCULO DE HORAS TRABAJADAS DESCONTANDO PAUSA Y REDONDEANDO A PASOS DE 0.5 STUNDEN
        function calcularNetoHoras(clockIn, clockOut, lunchStart, lunchEnd) {
            if (!clockIn || !clockOut) return { netoStr: '-', minsPausa: 0 };
            
            const tIn = new Date(clockIn).getTime();
            const tOut = new Date(clockOut).getTime();
            
            if (isNaN(tIn) || isNaN(tOut) || tOut <= tIn) return { netoStr: '-', minsPausa: 0 };
            
            let totalMins = (tOut - tIn) / (1000 * 60);
            let minsPausa = 0;

            if (lunchStart && lunchEnd) {
                const tLStart = new Date(lunchStart).getTime();
                const tLEnd = new Date(lunchEnd).getTime();
                if (!isNaN(tLStart) && !isNaN(tLEnd) && tLEnd > tLStart) {
                    minsPausa = (tLEnd - tLStart) / (1000 * 60);
                }
            }

            let netoMins = totalMins - minsPausa;
            if (netoMins < 0) netoMins = 0;

            // Redondeo al 0.5 o entero más cercano
            const horas = netoMins / 60.0;
            const redondeado = Math.round(horas * 2) / 2.0;
            const netoStr = `${redondeado.toFixed(1).replace('.', ',')} Std.`;

            return { netoStr, minsPausa: Math.round(minsPausa) };
        }

        async function cargarJornadas(modo, fechaIniCustom = null, fechaFinCustom = null) {
            tablaCuerpo.innerHTML = `
                <tr>
                    <td colspan="5" class="py-6 text-center text-indigo-600 font-medium">
                        Daten werden aus Supabase geladen...
                    </td>
                </tr>
            `;

            try {
                let query = supabase
                    .from('employee_daily_logs')
                    .select('*')
                    .order('work_date', { ascending: true })
                    .order('clock_in_time', { ascending: true });

                // Filtro por Empleado Específico o Todos
                if (selectEmpleado.value !== 'todos') {
                    query = query.eq('employee_name', selectEmpleado.value);
                }

                // Filtro de Fechas
                if (modo === 'manual' && fechaIniCustom && fechaFinCustom) {
                    query = query.gte('work_date', fechaIniCustom).lte('work_date', fechaFinCustom);
                    textoPeriodoPDF = `Zeitraum: ${formatearFechaEspanolAAleman(fechaIniCustom)} – ${formatearFechaEspanolAAleman(fechaFinCustom)}`;
                } else if (modo !== 'todo') {
                    const { inicio, fin } = obtenerFechasPorModo(modo);
                    query = query.gte('work_date', inicio).lte('work_date', fin);
                    textoPeriodoPDF = `Zeitraum: ${formatearFechaEspanolAAleman(inicio)} – ${formatearFechaEspanolAAleman(fin)}`;
                } else {
                    textoPeriodoPDF = `Vollständige Historie aller Arbeitszeiten`;
                }

                const { data, error } = await query;

                if (error) throw error;

                if (!data || data.length === 0) {
                    tablaCuerpo.innerHTML = `
                        <tr>
                            <td colspan="5" class="py-6 text-center text-gray-500">
                                Keine Arbeitszeiten für diesen Zeitraum gefunden.
                            </td>
                        </tr>
                    `;
                    btnDescargarPDF.disabled = true;
                    return;
                }

                let htmlRows = '';
                data.forEach((item) => {
                    const fecha = formatearFechaEspanolAAleman(item.work_date);
                    const empleado = item.employee_name || 'Unbekannt';
                    const entrada = formatearHora(item.clock_in_time);
                    const salida = formatearHora(item.clock_out_time);
                    
                    const horarioStr = (entrada !== '-' || salida !== '-') ? `${entrada} – ${salida}` : '-';
                    
                    const { netoStr, minsPausa } = calcularNetoHoras(
                        item.clock_in_time, 
                        item.clock_out_time, 
                        item.lunch_start_time, 
                        item.lunch_end_time
                    );

                    const pausaStr = minsPausa > 0 ? `${minsPausa} Min.` : '-';

                    htmlRows += `
                        <tr class="log-card border-b border-gray-200 hover:bg-indigo-50/30 transition">
                            <td class="py-2.5 px-2 font-medium text-gray-800 whitespace-nowrap w-1/6">${fecha}</td>
                            <td class="py-2.5 px-2 font-semibold text-gray-900 w-1/4">${empleado}</td>
                            <td class="py-2.5 px-2 text-center text-gray-700 whitespace-nowrap w-1/5">${horarioStr}</td>
                            <td class="py-2.5 px-2 text-center text-gray-500 whitespace-nowrap w-1/6">${pausaStr}</td>
                            <td class="py-2.5 px-2 text-center font-bold text-indigo-700 whitespace-nowrap w-1/6">${netoStr}</td>
                        </tr>
                    `;
                });

                tablaCuerpo.innerHTML = htmlRows;
                btnDescargarPDF.disabled = false;

            } catch (err) {
                console.error('Fehler beim Abfragen von Supabase:', err);
                tablaCuerpo.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-6 text-center text-red-500 font-medium">
                            Fehler beim Laden der Daten: ${err.message || 'Bitte Verbindung prüfen.'}
                        </td>
                    </tr>
                `;
                btnDescargarPDF.disabled = true;
            }
        }

        function activarBotonRango(modoSeleccionado) {
            botonesRango.forEach(btn => {
                if (btn.dataset.rango === modoSeleccionado) {
                    btn.className = 'btn-rango px-2.5 py-1 text-xs font-semibold rounded-lg border bg-indigo-50 border-indigo-200 text-indigo-700';
                } else {
                    btn.className = 'btn-rango px-2.5 py-1 text-xs font-semibold rounded-lg border bg-white border-gray-200 text-gray-600 hover:bg-gray-50';
                }
            });
        }

        botonesRango.forEach(btn => {
            btn.addEventListener('click', () => {
                chkRangoManual.checked = false;
                panelRangoManual.classList.add('hidden');
                modoActual = btn.dataset.rango;
                activarBotonRango(modoActual);
                cargarJornadas(modoActual);
            });
        });

        // Evento al cambiar de empleado en el desplegable
        selectEmpleado.addEventListener('change', () => {
            if (chkRangoManual.checked) {
                cargarJornadas('manual', fechaDesde.value, fechaHasta.value);
            } else {
                cargarJornadas(modoActual);
            }
        });

        // Toggle para Rango Manual
        chkRangoManual.addEventListener('change', (e) => {
            if (e.target.checked) {
                panelRangoManual.classList.remove('hidden');
                const hoyStr = new Date().toISOString().slice(0,10);
                if (!fechaDesde.value) fechaDesde.value = hoyStr;
                if (!fechaHasta.value) fechaHasta.value = hoyStr;
            } else {
                panelRangoManual.classList.add('hidden');
                activarBotonRango('semana_actual');
                cargarJornadas('semana_actual');
            }
        });

        // Botón Aplicar Rango Manual
        btnAplicarManual.addEventListener('click', () => {
            if (!fechaDesde.value || !fechaHasta.value) {
                alert('Bitte Start- und Enddatum auswählen.');
                return;
            }
            botonesRango.forEach(btn => btn.className = 'btn-rango px-2.5 py-1 text-xs font-semibold rounded-lg border bg-white border-gray-200 text-gray-600 hover:bg-gray-50');
            cargarJornadas('manual', fechaDesde.value, fechaHasta.value);
        });

        btnImprimir.addEventListener('click', () => window.print());

        // EXPORTACIÓN A PDF CON MARGENES DE 28mm PERFECTOS
        btnDescargarPDF.addEventListener('click', () => {
            const elemento = document.getElementById('pdfContainer');
            const opciones = {
                margin:       [28, 8, 12, 8],
                filename:     `Arbeitszeiten_${new Date().toISOString().slice(0,10)}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: ['css', 'legacy'], avoid: ['.log-card'] }
            };

            html2pdf().set(opciones).from(elemento).toPdf().get('pdf').then((pdf) => {
                const totalPages = pdf.internal.getNumberOfPages();
                
                for (let i = 1; i <= totalPages; i++) {
                    pdf.setPage(i);
                    
                    // Membrete en franja reservada de los primeros 20mm
                    pdf.setFont("helvetica", "bold");
                    pdf.setFontSize(13);
                    pdf.setTextColor(17, 24, 39);
                    pdf.text("ARBEITSZEITEN & ZEITERFASSUNG", 8, 11);
                    
                    pdf.setFont("helvetica", "normal");
                    pdf.setFontSize(8);
                    pdf.setTextColor(107, 114, 128);
                    pdf.text(textoPeriodoPDF, 8, 16);
                    
                    pdf.setFont("helvetica", "bold");
                    pdf.setFontSize(6);
                    pdf.setTextColor(156, 163, 175);
                    pdf.text("AUSSTELLUNGSDATUM", 202, 11, { align: "right" });
                    
                    pdf.setFont("helvetica", "normal");
                    pdf.setFontSize(8);
                    pdf.setTextColor(55, 65, 81);
                    pdf.text(fechaEmisionPDF, 202, 15, { align: "right" });
                    
                    // Línea azul horizontal en 19mm
                    pdf.setDrawColor(79, 70, 229);
                    pdf.setLineWidth(0.5);
                    pdf.line(8, 19, 202, 19);
                }
            }).save();
        });

        // Inicialización
        cargarListaEmpleados();
        cargarJornadas('semana_actual');
    </script>
</body>
</html>
