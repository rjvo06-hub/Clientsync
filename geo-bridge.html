<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesando Ubicación... | ClientSync</title>
    <!-- Tailwind CSS CDN para mantener la estética limpia -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-8 text-center border border-slate-100">
        <!-- Spinner de carga -->
        <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-500 border-t-transparent mb-4"></div>
        <h1 class="text-lg font-bold text-slate-900 mb-1">Obteniendo dirección...</h1>
        <p class="text-slate-500 text-xs">Consultando las coordenadas seleccionadas en el mapa.</p>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const lat = urlParams.get('latitude');
            const lon = urlParams.get('longitude');

            if (!lat || !lon) {
                alert('No se recibieron coordenadas válidas.');
                window.location.href = './index.html';
                return;
            }

            try {
                // Consulta exacta usando Nominatim (igual que tu ejemplo funcional)
                const apiUrl = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`;
                const response = await fetch(apiUrl, {
                    headers: { 'Accept-Language': 'es' }
                });

                if (!response.ok) throw new Error("Error al conectar con el servicio de mapas.");

                const data = await response.json();
                
                if (data.error) {
                    // Si por algo no encuentra calle exacta, pasamos al menos las coordenadas
                    const fallbackParams = new URLSearchParams({
                        address: '',
                        postal_code: '',
                        latitude: lat,
                        longitude: lon
                    });
                    window.location.href = `client-builder.html?${fallbackParams.toString()}`;
                    return;
                }

                const address = data.address || {};
                const street = address.road || address.pedestrian || address.street || address.footway || '';
                const houseNumber = address.house_number || '';
                const postcode = address.postcode || '';

                // Construimos la dirección limpia (ej. "Haidgraben 89" o solo la calle si no hay número)
                let fullAddress = street;
                if (houseNumber && houseNumber !== 'S/N') {
                    fullAddress += ` ${houseNumber}`;
                }

                // Empaquetamos todo para enviarlo limpio a client-builder.html
                const finalParams = new URLSearchParams({
                    address: fullAddress.trim(),
                    postal_code: postcode,
                    latitude: lat,
                    longitude: lon
                });

                // Redirección automática inmediata al formulario de creación de cliente
                window.location.href = `client-builder.html?${finalParams.toString()}`;

            } catch (err) {
                console.error(err);
                // Si falla la red, redirigimos pasando al menos las coordenadas para que el usuario no se quede bloqueado
                const errorParams = new URLSearchParams({
                    latitude: lat,
                    longitude: lon
                });
                window.location.href = `client-builder.html?${errorParams.toString()}`;
            }
        });
    </script>
</body>
</html>
