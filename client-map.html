<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClientSync | Mapa de Clientes</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --border-subtle: #e2e8f0;
            --radius-xl: 16px;
            --radius-md: 10px;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }

        /* Header Minimalista con Botón de Regresar */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 2px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Botón discreto para regresar al inicio */
        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background: #f1f5f9;
        }

        .app-header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.3px;
            color: #0f172a;
        }

        .badge-brand {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            background: #f1f5f9;
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
        }

        /* Sección del Mapa Ocupando el Protagonismo */
        .map-section {
            background: var(--card-bg);
            padding: 12px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-subtle);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
        }

        .map-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 0 4px;
        }

        .map-header h2 {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        #map {
            width: 100%;
            height: 80vh;
            min-height: 480px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            overflow: hidden;
        }

        @media (max-width: 768px) {
            #map {
                height: 75vh;
                min-height: 400px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header minimalista con opción para volver -->
        <header class="app-header">
            <div class="header-left">
                <a href="./index.html" class="btn-back">← Volver</a>
                <h1>ClientSync</h1>
            </div>
            <span class="badge-brand">WerkSolutions</span>
        </header>

        <!-- Sección del Mapa Limpia sin barra de navegación inferior -->
        <section class="map-section">
            <div class="map-header">
                <h2>📍 Mapa General de Clientes</h2>
            </div>
            <div id="map"></div>
        </section>
    </div>

    <!-- Script de Google Maps -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC4uaDGEnYaYHBqxhcCGyKA2uTAyJmwRZQ" async defer></script>

    <!-- Scripts de la app y del mapa -->
    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/map.js"></script>
</body>
</html>
